# Builds the game on a clean machine, for every pull request. If it doesn't build, the merge stops, for everyone. This is a required check.
#
# The other checks scan the code and run the small test programs, and none of them builds the game. So without this, a change could pass
# every check and still not build, and nobody would find out until after it had merged (AvP Tao #2: the gate proves the game builds on a
# clean machine).
#
# The game isn't kept: the build isn't uploaded, because anyone can download what a public repository builds, and nothing is released until
# it's safe. A test build is a separate step that only the owner starts: see build.yml, which uses the same script as this. When the owner
# starts this one by hand, it keeps the libraries it built, with their hashes, for a machine that can't build them (see the step below).
name: Game build

on:
  push:
    branches: [avpx_main]
  pull_request:
    branches: [avpx_main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-the-game:
    name: Build the game
    runs-on: windows-2025-vs2026   # pinned: Windows Server 2025 with Visual Studio 2026, the compiler we build with
    # The libraries are built from source, so this takes a while, but it shouldn't sit forever if something hangs
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A copy of these on the machine could hide one that's missing from the package, so the log says whether this machine has them.
      - name: Say which of Microsoft's old DirectX files this machine already has
        shell: pwsh
        run: |
          foreach ($name in 'D3DCompiler_43.dll', 'd3dx9_43.dll') {
            foreach ($folder in "$env:windir\SysWOW64", "$env:windir\System32") {
              '{0} in {1}: {2}' -f $name, $folder, (Test-Path (Join-Path $folder $name))
            }
          }

      - name: Build the game and make its package
        shell: pwsh
        run: ./tools/build-and-package.ps1 -OutFolder "$env:RUNNER_TEMP\package"

      # The checks a release makes of its package, made of this pull request's package too, so a change to the package or to these checks
      # is proved here, before a release depends on it
      - name: Check the package as a release would
        shell: pwsh
        run: ./tools/check-release-package.ps1 -Package "$env:RUNNER_TEMP\package" -Commit $env:GITHUB_SHA

      # The symbols and map of the game and its two film libraries, to name the place of a crash in this build. They're never in the
      # package. This is open source, so they hold nothing secret, and the folders they name are this machine's.
      - name: Keep the symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symbols
          path: |
            win32/VS2026/Win32/Release/*.pdb
            win32/VS2026/Win32/Release/*.map
          if-no-files-found: error

      # Only when the owner starts this by hand: the libraries this run built, for a developer's machine that can't build them itself
      # (RELEASING.md, "Building on a machine without vcpkg"). They're what the game was just built against, from our pinned ports. The
      # log prints a SHA-256 for every file and for the list, so a copy downloaded later can be checked against this run. They're libraries
      # only, never the game, and they're kept for a week. They're kept even if the game itself then fails to build, so that the libraries
      # can be proven, and used, on their own.
      - name: List the libraries' hashes
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed\x86-windows-static'
          $list = Join-Path $root 'SHA256SUMS.txt'
          Get-ChildItem $root -Recurse -File | Where-Object { $_.FullName -ne $list } | Sort-Object FullName | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.FullName.Substring($root.Length + 1).Replace('\', '/')
          } | Out-File -Encoding ascii $list
          Get-Content $list
          'The list itself: ' + (Get-FileHash -Algorithm SHA256 $list).Hash.ToLower()

      - name: Keep the libraries
        id: libraries
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-libraries
          path: vcpkg_installed/x86-windows-static
          retention-days: 7
          if-no-files-found: error

      - name: Say the libraries' artifact hash
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          DIGEST: ${{ steps.libraries.outputs.artifact-digest }}
        run: "\"The artifact's own SHA-256, of the zip GitHub keeps: $env:DIGEST\""

      # It works whether or not this machine has its own copies, because the test tells Windows not to look at them: see tests/package_test.cpp.
      - name: Try the package, and show its checks refuse a package with something wrong
        shell: pwsh
        run: |
          ./tests/build.ps1 -Only package_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./tests/try-package.ps1 -Package "$env:RUNNER_TEMP\package\bin" -TestProgram "$env:RUNNER_TEMP\avp-tests\package_test.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
