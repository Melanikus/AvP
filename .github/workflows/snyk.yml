# Security gate for this repository (AvP Tao #1: security is paramount, the goal is zero vulnerabilities).
#
# Three jobs run for every pull request into avpx_main. All must pass before anything can merge:
#   - Snyk Code (SAST) reads our own source. It also fails if Snyk skipped even one C/C++ file, because a file the
#     scanner could not read is a blind spot, not a pass.
#   - Snyk Open Source (SCA) recognises vendored open-source code by file hashes and reports known vulnerabilities. It
#     also fails if precompiled code (DLLs, libraries, executables) is in the repository.
#   - Snyk on the vcpkg libraries builds our open-source dependencies exactly as the game does, then runs SAST and SCA
#     on the patched source that was really compiled. On a pull request or a push it does that whenever a library file changed,
#     and otherwise passes at once, saying so; run by hand it always does; and a release asks for a full scan of its own commit
#     (the owner's ruling R-BLD-12, below). Microsoft's D3DX is a binary package with no source to read, so
#     it is not scanned. For the libraries Snyk can't recognise (the two post-quantum ones, #174), known vulnerabilities
#     come from their projects' own GitHub security advisories, checked by machine (tools/check-advisories.ps1).
# ANY finding or scan error fails its job. A finding is resolved only by fixing it in the code: we don't ignore, park
# or exclude findings. The single exception is .github/snyk-accepted.json: 4 reports where Snyk's own data is wrong, which
# no code change can clear. It names each report and expires. If Snyk or GitHub Actions is unavailable, the checks fail
# and nothing merges.
name: Snyk

on:
  push:
    branches: [avpx_main]
  pull_request:
    branches: [avpx_main]
  workflow_dispatch:
  # Every night, so a vulnerability published today in our own code's view is noticed by morning, even when nobody is committing.
  # The vcpkg libraries aren't scanned on the nightly run (R-BLD-12): the release scans them. Scheduled runs use this file on the default branch. A failure here blocks nothing by itself, but the next
  # pull request scans the same libraries and is blocked until it's dealt with, and GitHub emails the owner.
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

# The gate's own engine is pinned too: an exact Snyk CLI release, checked against this hash before it runs. Updating it
# is a deliberate, reviewed change here, so a bad "latest" release can never reach the gate or its token.
# The hash is the one published for this release both on downloads.snyk.io and in snyk/cli's GitHub release.
env:
  SNYK_CLI_VERSION: v1.1308.3
  SNYK_CLI_SHA256: 5f323f45885341ea1473639859271925912ece82a2f77bc146bb4468f9838840
  # The script and workflow scanners (the end of the Snyk Code job), pinned the same way. Each hash is its release file's, as GitHub publishes it,
  # chosen on 2026-11-21 after a review of each: its hashes, its signatures or build records, and its source read for what it reaches.
  PSSCRIPTANALYZER_VERSION: 1.25.0
  PSSCRIPTANALYZER_SHA256: 14e634c828eb98efb9f40b2918ba90f139ed5eccdf663a2a747736d996995d60
  INJECTIONHUNTER_VERSION: 1.0.0
  INJECTIONHUNTER_SHA256: feb24c5c3e98f4741f3967a558983e5e23303e6fd9ed4f34e4b96cbe72a8f650
  ZIZMOR_VERSION: 1.32.0
  ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_DEB_VERSION: 0.9.0-1
  SHELLCHECK_DEB_SHA256: eadf78f4dfcb1a271f47a9be5e38d124dffe9d4fea74956fab34e8c3e322a854

jobs:
  snyk-code:
    name: Snyk Code (SAST)
    runs-on: ubuntu-24.04   # pinned, so a runner-image migration never changes the security gate
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Snyk CLI
        run: |
          curl -fsSL "https://downloads.snyk.io/cli/$SNYK_CLI_VERSION/snyk-linux" -o "$RUNNER_TEMP/snyk"
          echo "$SNYK_CLI_SHA256  $RUNNER_TEMP/snyk" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/snyk"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Scanners can be told to look away with a comment or a settings file. We fix findings, so none of those may exist.
      - name: Fail if anything tells a scanner to look away
        run: |
          found=$(git grep -n -i -E 'deepcode ignore|snyk:ignore|lgtm\[|codeql\[' -- . ':!.github' || true)
          files=$(git ls-files | grep -E '(^|/)\.(snyk|dcignore)$' || true)
          if [ -n "$found$files" ]; then
            echo "$found"
            echo "$files"
            echo "::error::Something in the repository suppresses a scanner"
            exit 1
          fi
          echo "No scanner suppressions found."

      # Exit 1 is findings, which fail at once. Exit 2 or more is an error, retried; it fails if it never clears.
      - name: Snyk Code (SAST)
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if snyk code test --sarif-file-output=snyk-code.sarif; then rc=0; else rc=$?; fi
            if [ "$rc" -lt 2 ]; then break; fi
            echo "Snyk Code error (exit $rc) on attempt $attempt"
            sleep 30
          done
          exit "$rc"

      # Snyk reports how many files it read in the SARIF. A file it could not parse is silently skipped and the scan
      # still passes, so we compare its count with what git tracks. Anything Snyk calls other than SUPPORTED counts as not
      # read, whatever the name. Names are matched in any case, because an old file could be called OLDFILE.CPP. A
      # missing report fails here too, and so does a count of zero, which would mean this check compared nothing.
      - name: Fail if Snyk Code skipped any C/C++ file
        if: ${{ !cancelled() }}
        run: |
          types='\.(c|cc|cpp|cxx|c\+\+|h|hh|hpp|hxx|h\+\+|inl|ipp|tpp|inc)$'
          tracked=$(git ls-files | grep -ciE "$types" || true)
          analysed=$(jq --arg types "$types" '[.runs[0].properties.coverage[]? | select(.type == "SUPPORTED" and (.lang | ascii_downcase | test($types))) | .files] | add // 0' snyk-code.sarif)
          unparsed=$(jq '[.runs[0].properties.coverage[]? | select(.type != "SUPPORTED") | .files] | add // 0' snyk-code.sarif)
          echo "C/C++ files tracked by git: $tracked, analysed by Snyk: $analysed, not analysed: $unparsed"
          jq -c '.runs[0].properties.coverage' snyk-code.sarif
          if [ "$tracked" -eq 0 ] || [ "$unparsed" != "0" ] || [ "$analysed" != "$tracked" ]; then
            echo "::error::Snyk Code did not analyse every C/C++ file"
            exit 1
          fi

      - name: Upload Snyk Code results
        if: ${{ !cancelled() && hashFiles('snyk-code.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      # --- The scripts and the workflows (added 2026-11-21, Tao 1: Snyk Code reads no PowerShell, workflow YAML or bash, and a blind spot
      # fails the gate). Four scanners, each pinned like Snyk's CLI above: its version and SHA-256 here, checked before it runs, and for the
      # two built by their own project's release workflow, that workflow's signed record of building it (gh attestation verify). Each
      # finding fails its step. Every step below runs even when one before it failed, so one run shows them all.
      #   PowerShell: PSScriptAnalyzer (Microsoft's), with the security rules below and InjectionHunter's injection rules (Microsoft's)
      #   workflow YAML: zizmor (GitHub Actions security) and actionlint (workflow errors)
      #   bash: shellcheck, Ubuntu's own package, run by actionlint on each bash step and on its own on every .sh file
      - name: Install the pinned script and workflow scanners
        if: ${{ !cancelled() }}
        # The job's read-only token: gh attestation verify asks GitHub for the tools' build records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/scanners"; mkdir -p "$t"

          # zizmor and actionlint: their release files, by hash, and the record that their own release workflow built them at that tag
          curl -fsSL "https://github.com/zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION/zizmor-x86_64-unknown-linux-gnu.tar.gz" -o "$t/zizmor.tar.gz"
          echo "$ZIZMOR_SHA256  $t/zizmor.tar.gz" | sha256sum -c -
          gh attestation verify "$t/zizmor.tar.gz" --repo zizmorcore/zizmor --deny-self-hosted-runners \
            --cert-identity "https://github.com/zizmorcore/zizmor/.github/workflows/release.yml@refs/tags/v$ZIZMOR_VERSION"
          mkdir -p "$t/zizmor" && tar -xzf "$t/zizmor.tar.gz" -C "$t/zizmor"

          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$t/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $t/actionlint.tar.gz" | sha256sum -c -
          gh attestation verify "$t/actionlint.tar.gz" --repo rhysd/actionlint --deny-self-hosted-runners \
            --cert-identity "https://github.com/rhysd/actionlint/.github/workflows/release.yaml@refs/tags/v$ACTIONLINT_VERSION"
          mkdir -p "$t/actionlint" && tar -xzf "$t/actionlint.tar.gz" -C "$t/actionlint"

          # shellcheck: Ubuntu's own package. apt checks the archive's signature as it fetches the list and the package, and the package's
          # hash is checked here. dpkg-deb -x only unpacks it: none of the package's own scripts run.
          sudo apt-get update -qq
          (cd "$t" && apt-get download "shellcheck=$SHELLCHECK_DEB_VERSION")
          echo "$SHELLCHECK_DEB_SHA256  $t/shellcheck_${SHELLCHECK_DEB_VERSION}_amd64.deb" | sha256sum -c -
          dpkg-deb -x "$t/shellcheck_${SHELLCHECK_DEB_VERSION}_amd64.deb" "$t/shellcheck"

          # PSScriptAnalyzer and InjectionHunter: Microsoft's packages from the PowerShell Gallery, by hash. Every code file in both carries
          # Microsoft's signature, checked when these hashes were chosen (2026-11-21); the hash pins those exact files.
          curl -fsSL "https://www.powershellgallery.com/api/v2/package/PSScriptAnalyzer/$PSSCRIPTANALYZER_VERSION" -o "$t/psscriptanalyzer.nupkg"
          echo "$PSSCRIPTANALYZER_SHA256  $t/psscriptanalyzer.nupkg" | sha256sum -c -
          unzip -q "$t/psscriptanalyzer.nupkg" -d "$t/PSScriptAnalyzer"
          curl -fsSL "https://www.powershellgallery.com/api/v2/package/InjectionHunter/$INJECTIONHUNTER_VERSION" -o "$t/injectionhunter.nupkg"
          echo "$INJECTIONHUNTER_SHA256  $t/injectionhunter.nupkg" | sha256sum -c -
          unzip -q "$t/injectionhunter.nupkg" -d "$t/InjectionHunter"

          "$t/zizmor/zizmor" --version; "$t/actionlint/actionlint" -version | head -1; "$t/shellcheck/usr/bin/shellcheck" --version | sed -n 2p

      # These scanners can be told to look away too: a comment in a script, or a settings file they find by themselves. We fix findings,
      # so none of those may exist. (Each word is written here so that it doesn't match itself.)
      - name: Fail if anything tells the script or workflow scanners to look away
        if: ${{ !cancelled() }}
        run: |
          found=$(git grep -n -I -E 'Suppress[M]essage|shellcheck[ ]disable|zizmor:[ ]ignore' || true)
          files=$(git ls-files | grep -iE '(^|/)(PSScriptAnalyzerSettings\.psd1|\.?shellcheckrc|\.?zizmor\.ya?ml)$|^\.github/actionlint\.ya?ml$' || true)
          if [ -n "$found$files" ]; then
            echo "$found"
            echo "$files"
            echo "::error::Something in the repository tells a script or workflow scanner to look away"
            exit 1
          fi
          echo "No suppressions, and no scanner settings files."

      # zizmor reads every workflow and action git tracks, named one by one, so none is left out. --no-ignores: no comment or settings file
      # can hide a finding. With the job's read-only token it also asks GitHub whether each pinned action is that action's own commit, and
      # whether it has a known vulnerability. If GitHub can't be reached, zizmor stops with an error and this step fails.
      - name: Workflows (SAST) - zizmor
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml' '.github/actions/**/action.yml' '.github/actions/**/action.yaml')
          echo "zizmor reads ${#files[@]} files"
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No workflow to read"; exit 1; }
          "$RUNNER_TEMP/scanners/zizmor/zizmor" --no-ignores --persona=regular --cache-dir "$RUNNER_TEMP/zizmor-cache" "${files[@]}"

      # actionlint reads every workflow, and hands each bash step to the pinned shellcheck by its path (never one found on the runner).
      - name: Workflows - actionlint, with shellcheck on each bash step
        if: ${{ !cancelled() }}
        run: |
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          echo "actionlint reads ${#files[@]} workflows"
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No workflow to read"; exit 1; }
          "$RUNNER_TEMP/scanners/actionlint/actionlint" -shellcheck="$RUNNER_TEMP/scanners/shellcheck/usr/bin/shellcheck" -pyflakes= "${files[@]}"

      # The .sh files, with the same shellcheck. --norc: no settings file changes what it reports.
      - name: Shell scripts - shellcheck
        if: ${{ !cancelled() }}
        run: |
          mapfile -t files < <(git ls-files -- '*.sh' '*.bash')
          echo "shellcheck reads ${#files[@]} .sh files"
          if [ "${#files[@]}" -eq 0 ]; then echo "No .sh files here"; exit 0; fi
          "$RUNNER_TEMP/scanners/shellcheck/usr/bin/shellcheck" --norc "${files[@]}"

      # PowerShell: every .ps1, .psm1 and .psd1 git tracks, and every PowerShell step of the workflows and actions, each written to a file of
      # its own first (a step's shell is its shell:, or the runner's own: pwsh on Windows, bash elsewhere). A step that no scanner here reads
      # fails, and so does any file PowerShell can't parse. Then PSScriptAnalyzer's security rules and InjectionHunter's rules on all of them:
      # any finding fails, and so does any finding a script has asked it to leave out.
      - name: PowerShell (SAST) - PSScriptAnalyzer and InjectionHunter
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scanners = Join-Path $env:RUNNER_TEMP 'scanners'
          $steps = Join-Path $env:RUNNER_TEMP 'powershell-steps'
          New-Item -ItemType Directory -Force $steps | Out-Null

          # 1. Every workflow and action step's run: and its shell. A job named run: is at column 2; a step's run: is at column 6 or deeper.
          $yamlFiles = @(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml' '.github/actions/**/action.yml' '.github/actions/**/action.yaml')
          $expected = 0; $pwshSteps = 0; $bashSteps = 0; $unread = @()
          foreach ($file in $yamlFiles) {
              $lines = @(Get-Content -LiteralPath $file)
              $isAction = $file -like '.github/actions/*'

              # Each job's runs-on, as plain words; a runs-on that isn't (an expression, a list) is unknown
              $jobOf = @{}; $windows = @{}; $inJobs = $false; $job = $null
              for ($i = 0; $i -lt $lines.Count; $i++) {
                  if ($lines[$i] -match '^jobs:\s*(#.*)?$') { $inJobs = $true; continue }
                  if ($lines[$i] -match '^\S') { $inJobs = $false }
                  if ($inJobs -and $lines[$i] -match '^  ([A-Za-z0-9_-]+):\s*(#.*)?$') { $job = $Matches[1] }
                  if ($inJobs -and $job -and $lines[$i] -match '^    runs-on:\s*([A-Za-z0-9_.-]+)\s*(#.*)?$') { $windows[$job] = $Matches[1] -match 'windows' }
                  $jobOf[$i] = $job
              }

              for ($i = 0; $i -lt $lines.Count; $i++) {
                  if ($lines[$i] -notmatch '^(?<lead>\s*)(?<dash>- )?run:(?<rest>.*)$') { continue }
                  $key = $Matches.lead.Length + $Matches.dash.Length
                  if ($key -lt 6) { continue }
                  $expected++
                  $rest = $Matches.rest.Trim()

                  # The step's own lines, for its shell:
                  $start = $i
                  while ($start -ge 0 -and $lines[$start] -notmatch "^\s{$($key - 2)}- ") { $start-- }
                  $end = $i + 1
                  while ($end -lt $lines.Count -and ($lines[$end] -match '^\s*$' -or ($lines[$end] -match '^(\s*)' -and $Matches[1].Length -ge $key -and $lines[$end] -notmatch "^\s{$($key - 2)}- "))) { $end++ }
                  $shell = $null
                  for ($j = [Math]::Max($start, 0); $j -lt $end; $j++) {
                      if ($lines[$j] -match "^(\s{$key}|\s{$($key - 2)}- )shell:\s*([A-Za-z0-9_.-]+)") { $shell = $Matches[2] }
                  }
                  $where = "${file}:$($i + 1)"
                  if (-not $shell) {
                      if ($isAction) { $unread += "$where (an action's step names no shell)"; continue }
                      if (-not $windows.ContainsKey($jobOf[$i])) { $unread += "$where (its job's runs-on isn't plain words)"; continue }
                      $shell = if ($windows[$jobOf[$i]]) { 'pwsh' } else { 'bash' }
                  }

                  # Its text: the block under it, or the rest of its line
                  if ($rest -match '^[|>][+-]?\s*(#.*)?$') {
                      $body = @(); $j = $i + 1
                      while ($j -lt $lines.Count -and ($lines[$j] -match '^\s*$' -or ($lines[$j] -match '^(\s*)' -and $Matches[1].Length -gt $key))) { $body += $lines[$j]; $j++ }
                      $indent = (@($body | Where-Object { $_ -match '\S' } | ForEach-Object { ($_ -replace '^(\s*).*$', '$1').Length }) | Measure-Object -Minimum).Minimum
                      $text = (@($body | ForEach-Object { if ($_.Length -ge $indent) { $_.Substring($indent) } else { '' } }) -join "`n")
                  }
                  else {
                      $text = $rest -replace "^'(.*)'$", '$1' -replace '^"(.*)"$', '$1'
                  }

                  if ($shell -match '^(pwsh|powershell)$') {
                      # GitHub fills in each of its expressions (a dollar and two braces) before PowerShell reads the step: a plain word stands in
                      $text = [regex]::Replace($text, '\$\{\{.*?\}\}', 'GITHUB_EXPRESSION')
                      [System.IO.File]::WriteAllText((Join-Path $steps (($file -replace '[\\/.]', '_') + "_line$($i + 1).ps1")), $text + "`n")
                      $pwshSteps++
                  }
                  elseif ($shell -match '^(bash|sh)$') { $bashSteps++ }
                  else { $unread += "$where (shell $shell, which no scanner here reads)" }
              }
          }
          Write-Host "Workflow and action files: $($yamlFiles.Count); steps with run: $expected; PowerShell: $pwshSteps; bash: $bashSteps (actionlint's shellcheck)"
          foreach ($u in $unread) { Write-Host "::error::A step no scanner reads: $u" }
          if ($expected -eq 0 -or $unread.Count -or ($pwshSteps + $bashSteps) -ne $expected) { throw 'A workflow step that no scanner reads is a blind spot' }

          # 2. Every file PowerShell must read, and each must parse
          $tracked = @(git ls-files | Where-Object { $_ -match '\.(ps1|psm1|psd1)$' })
          $all = @($tracked | ForEach-Object { (Resolve-Path -LiteralPath $_).Path }) + @(Get-ChildItem -LiteralPath $steps -Filter '*.ps1' | ForEach-Object { $_.FullName })
          $parseErrors = 0
          foreach ($path in $all) {
              $tokens = $null; $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
              foreach ($e in $errors) { Write-Host "::error::$(Split-Path -Leaf $path):$($e.Extent.StartLineNumber) PowerShell can't parse it: $($e.Message)"; $parseErrors++ }
          }
          Write-Host "PowerShell to read: $($tracked.Count) files git tracks and $pwshSteps workflow steps; parse errors: $parseErrors"
          if ($parseErrors -or $all.Count -ne ($tracked.Count + $pwshSteps)) { throw 'A PowerShell file that can''t be read is a blind spot' }

          # 3. The scanners, on every one of them. The security rules, every severity: the credential rules (Microsoft's ScriptSecurity set),
          # code run from a string, unencrypted authentication, broken hash algorithms, an error swallowed by an empty catch, the three
          # comparisons and redirections that quietly do something else, assigning to PowerShell's own variables, and replacing its commands.
          Import-Module (Join-Path $scanners 'PSScriptAnalyzer/PSScriptAnalyzer.psd1')
          $injection = Join-Path $scanners 'InjectionHunter/InjectionHunter.psm1'
          $rules = @('PSAvoidUsingPlainTextForPassword', 'PSAvoidUsingComputerNameHardcoded', 'PSAvoidUsingConvertToSecureStringWithPlainText',
              'PSUsePSCredentialType', 'PSAvoidUsingUsernameAndPasswordParams', 'PSAvoidUsingInvokeExpression', 'PSAvoidUsingAllowUnencryptedAuthentication',
              'PSAvoidUsingBrokenHashAlgorithms', 'PSAvoidUsingEmptyCatchBlock', 'PSPossibleIncorrectComparisonWithNull',
              'PSPossibleIncorrectUsageOfAssignmentOperator', 'PSPossibleIncorrectUsageOfRedirectionOperator', 'PSAvoidAssignmentToAutomaticVariable',
              'PSAvoidOverwritingBuiltInCmdlets')
          $findings = @(); $leftOut = @()
          foreach ($path in $all) {
              $findings += @(Invoke-ScriptAnalyzer -Path $path -IncludeRule $rules)
              $findings += @(Invoke-ScriptAnalyzer -Path $path -CustomRulePath $injection)
              $leftOut += @(Invoke-ScriptAnalyzer -Path $path -IncludeRule $rules -SuppressedOnly)
              $leftOut += @(Invoke-ScriptAnalyzer -Path $path -CustomRulePath $injection -SuppressedOnly)
          }
          foreach ($f in $findings) { Write-Host "::error::$(Split-Path -Leaf $f.ScriptPath):$($f.Line) $($f.RuleName) ($($f.Severity)): $($f.Message)" }
          foreach ($f in $leftOut) { Write-Host "::error::$(Split-Path -Leaf $f.ScriptPath):$($f.Line) $($f.RuleName) was asked to look away" }
          Write-Host "PSScriptAnalyzer and InjectionHunter read $($all.Count) files: $($findings.Count) findings, $($leftOut.Count) left out on request"
          if ($findings.Count -or $leftOut.Count) { exit 1 }

  snyk-open-source:
    name: Snyk Open Source (SCA)
    runs-on: ubuntu-24.04   # pinned, so a runner-image migration never changes the security gate
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # We build our open-source dependencies from source, so nothing precompiled belongs here. Images and other
      # resources are fine; this looks only for compiled code. It checks each file's name, and also its first bytes,
      # because every kind of compiled file starts with its own signature, so a DLL renamed to .dat is still caught.
      - name: Fail if precompiled code is in the repository
        shell: bash
        run: |
          found=$(git ls-files | grep -iE '\.(dll|lib|exp|exe|obj|o|a|so|dylib|pdb|ilk|ocx|sys|zip|7z|rar|cab|gz|tgz|bz2|xz|zst|tar|msi|jar)$' || true)
          while IFS= read -r -d '' file; do
            [ -f "$file" ] || continue
            signature=$(head -c 8 -- "$file" | od -An -tx1 | tr -d ' \n')
            # A plain tar file has no mark at its start. Its mark, "ustar", is 257 bytes in.
            tar_mark=$(head -c 262 -- "$file" | tail -c +258 | od -An -tx1 | tr -d ' \n')
            case "$signature" in
              4d5a*)                                   ;; # Windows program or DLL
              7f454c46*)                               ;; # Linux program
              feedface*|feedfacf*|cefaedfe*|cffaedfe*) ;; # macOS program
              cafebabe*)                               ;; # macOS universal program, or Java class
              213c617263683e*)                         ;; # static library
              0061736d*)                               ;; # WebAssembly
              4c01*|6486*|64aa*)                       ;; # Windows object file
              504b0304*|504b0506*|504b0708*)           ;; # zip, and files built on it such as jar
              377abcaf271c*)                           ;; # 7z
              526172211a07*)                           ;; # rar
              4d534346*)                               ;; # cab
              1f8b*)                                   ;; # gzip
              d0cf11e0a1b11ae1*)                       ;; # msi
              425a683[1-9]31415926*)                   ;; # bzip2
              fd377a585a00*)                           ;; # xz
              28b52ffd*)                               ;; # zstd
              *) [ "$tar_mark" = 7573746172 ] || continue ;;
            esac
            found="$found"$'\n'"$file"
          done < <(git ls-files -z)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::Precompiled code, or an archive that could hold it, is in the repository"
            exit 1
          fi
          echo "No precompiled code found."

      - name: Install the pinned Snyk CLI
        run: |
          curl -fsSL "https://downloads.snyk.io/cli/$SNYK_CLI_VERSION/snyk-linux" -o "$RUNNER_TEMP/snyk"
          echo "$SNYK_CLI_SHA256  $RUNNER_TEMP/snyk" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/snyk"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Snyk recognises nothing here today, and that is expected: the only vendored code is Barry Duncan's decoders in
      # dependencies/, which are FFmpeg forks it can't match, so they were reviewed by hand. This step stays to catch
      # any open-source code added later. It prints no "Tested N" line when it matches nothing, so we check a scan really
      # ran. The proof that SCA recognises libraries is in the "Snyk on the vcpkg libraries" job.
      - name: Snyk Open Source (SCA, vendored C/C++)
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -o pipefail
          # Snyk exits 0 for clean, 1 for findings, 2 or more for an error such as a service failure. Only an error is
          # retried, and it still fails if it never clears: a scan that didn't finish is not a clean scan.
          for attempt in 1 2 3; do
            if snyk test --unmanaged --print-dep-paths --sarif-file-output=snyk-open-source.sarif | tee sca.log; then rc=0; else rc=$?; fi
            if [ "$rc" -lt 2 ]; then break; fi
            echo "Snyk Open Source error (exit $rc) on attempt $attempt"
            sleep 30
          done
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if ! grep -q 'Testing ' sca.log; then
            echo "::error::Snyk Open Source did not run a scan"
            exit 1
          fi

      - name: Upload Snyk Open Source results
        if: ${{ !cancelled() && hashFiles('snyk-open-source.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: snyk-open-source.sarif
          category: snyk-open-source

  # The owner's ruling R-BLD-12 (2026-11-14): "the lib is very unlikely to change in the next 24 hours and the release is where all is
  # gated". So the two library jobs below scan in full only when they're needed: when anything they scan or rely on has changed, when
  # they're run by hand, and before a release (tools/check-release.ps1 refuses a release whose commit has no passing "Build the vcpkg
  # libraries", which only a full scan runs). A library change never reaches avpx_main unscanned (Tao 1). The nightly run doesn't
  # scan the libraries, by the owner's choice, so a new advisory against a library we already pin is caught at the next release.
  vcpkg-changes:
    name: Did the libraries change?
    runs-on: ubuntu-24.04   # pinned, so a runner-image migration never changes the security gate
    outputs:
      full: ${{ steps.decide.outputs.full }}
      why: ${{ steps.decide.outputs.why }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the whole history, so what a pull request or a push changes can be seen

      # The commits to compare come in as plain text in the environment, never pasted into the script. When in doubt, it scans.
      - name: Decide whether the libraries are scanned in full
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          # Every file the two library jobs read, or that says which libraries the game is built from. A change to any of them scans the
          # libraries in full. It's written out here so anyone can see the whole list: add to it whenever those jobs read a new file.
          library_files='^(vcpkg\.json|vcpkg-configuration\.json|vcpkg-overlay-ports/|vcpkg-overlay-triplets/|dependencies/|\.github/workflows/snyk\.yml|\.github/snyk-accepted\.json|\.github/advisories-read\.json|tools/check-advisories\.ps1|tests/advisories-test\.ps1)'
          answer() { echo "full=$1" >> "$GITHUB_OUTPUT"; echo "why=$2" >> "$GITHUB_OUTPUT"; echo "Scan the libraries in full: $1 ($2)"; exit 0; }
          case "$EVENT" in
            workflow_dispatch) answer yes "it was run by hand" ;;
            schedule) answer no "the nightly run doesn't scan the libraries (R-BLD-12); the release does" ;;
            pull_request) from="$BASE" ;;
            push) from="$BEFORE" ;;
            *) answer yes "it's an event this check doesn't know: $EVENT" ;;
          esac
          # A push that starts a branch has no commit before it (all zeros), and an id that isn't one can't be compared: both scan in full.
          if ! [[ "$from" =~ ^[0-9a-f]{40}$ ]] || [ "$from" = "0000000000000000000000000000000000000000" ]; then
            answer yes "there's no earlier commit to compare with"
          fi
          if ! changed=$(git diff --name-only "$from...HEAD"); then
            answer yes "git couldn't say what changed"
          fi
          hits=$(printf '%s\n' "$changed" | grep -E "$library_files" || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            answer yes "the library files above changed"
          fi
          answer no "no library file changed; the libraries are scanned in full before a release"

  # The two jobs below scan what the game is really built from: vcpkg fetches each library (every download is checked
  # against the SHA512 in its port), applies its patches and ours, and compiles it. That needs Windows, so Windows
  # collects the patched sources and Linux scans them with the same pinned Snyk setup as above.
  vcpkg-sources:
    name: Build the vcpkg libraries
    needs: vcpkg-changes
    # Only when the libraries are scanned in full (above). Skipped otherwise, which a release refuses: tools/check-release.ps1 asks for
    # this job to have passed on the release's commit, so a release always has a full library scan behind it.
    if: needs.vcpkg-changes.outputs.full == 'yes'
    runs-on: windows-2025-vs2026   # pinned: Windows Server 2025 with Visual Studio 2026, the compiler we build with
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The registry commit is the builtin-baseline in vcpkg.json, so the library versions never drift.
      # bootstrap-vcpkg validates the signature of the vcpkg tool it downloads.
      - name: Get vcpkg at the manifest's baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          # It goes to git, so it has to be a commit's full hash first: a value starting with a dash would be read by git as an option
          if ("$baseline" -cnotmatch '^[0-9a-f]{40}$') { throw "vcpkg.json's builtin-baseline isn't a commit's full hash: $baseline" }
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git init -q $root
          git -C $root fetch -q --depth 1 https://github.com/microsoft/vcpkg.git $baseline
          git -C $root checkout -q FETCH_HEAD
          if ((git -C $root rev-parse HEAD) -cne $baseline) { throw 'vcpkg is not at the manifest baseline' }
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build the pinned libraries, keeping their sources
        shell: pwsh
        run: |
          $bt = Join-Path $env:RUNNER_TEMP 'bt'
          # --binarysource=clear: always build from source. A library restored from a cache has no sources to scan.
          & (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') install --triplet x86-windows --binarysource=clear `
            --x-install-root="$env:RUNNER_TEMP\installed" --x-buildtrees-root="$bt" --disable-metrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Everything vcpkg built is collected, so a new library is scanned without anyone changing this file. A library with
      # no source to collect fails, because a library we can't read is a blind spot. The only folders passed over are the
      # ones named here, which aren't libraries we compile: Microsoft's D3DX is a binary package, the two vcpkg-cmake ones
      # are build helpers, and the last two are vcpkg's own working folders.
      #
      # Every file is copied, the ones a library doesn't build (its examples and tests) included, so all of it is scanned.
      # A link (a symbolic link or a junction) isn't copied, because its files are already there, where it points:
      # mldsa-native's examples, for one, are links to the library's own sources and to its test random numbers, and
      # copying through them failed (#174, run 42564776267). Each link is written down with where it points, so nothing
      # leaves the scan without a line saying so. One that points outside its own library's source, or that can't be read,
      # fails the step: what it points at wouldn't be scanned at all. Get-ChildItem doesn't walk into links unless it's
      # told to, so nothing behind one is copied twice. Changed 2026-11-09 by Melanikus for the AvP port.
      - name: Collect each library's patched source
        shell: pwsh
        run: |
          $bt = Join-Path $env:RUNNER_TEMP 'bt'
          $out = Join-Path $env:RUNNER_TEMP 'libsrc'
          New-Item -ItemType Directory -Force $out | Out-Null
          $notLibraries = 'dxsdk-d3dx', 'vcpkg-cmake', 'vcpkg-cmake-config', 'detect_compiler', 'versioning_'
          $failed = $false
          foreach ($port in Get-ChildItem $bt -Directory) {
            if ($notLibraries -contains $port.Name) { continue }
            $src = Join-Path $port.FullName 'src'
            $folders = if (Test-Path $src) { @(Get-ChildItem $src -Directory) } else { @() }
            if ($folders.Count -eq 0) {
              Write-Output "::error::$($port.Name) was built but has no source to scan"
              $failed = $true
            }
            foreach ($d in $folders) {
              $top = $d.FullName.TrimEnd('\', '/')
              $copied = 0
              $links = 0
              foreach ($item in @(Get-ChildItem -LiteralPath $top -Recurse -Force)) {
                $relative = $item.FullName.Substring($top.Length + 1)
                # A hard link is a file like any other, so only these two are links here
                if ($item.LinkType -in @('SymbolicLink', 'Junction')) {
                  # Where it points: a junction's target is a whole path, a symbolic link's is often one from the link's own folder
                  $target = @($item.Target)[0]
                  $resolved = ''
                  if ($target) {
                    $fromHere = if ([System.IO.Path]::IsPathRooted($target)) { $target } else { Join-Path (Split-Path -Parent $item.FullName) $target }
                    $resolved = [System.IO.Path]::GetFullPath($fromHere).TrimEnd('\', '/')
                  }
                  # Inside means the source's own top folder or anything under it, compared as Windows compares names
                  $inside = $resolved -and ($resolved.Equals($top, [System.StringComparison]::OrdinalIgnoreCase) -or $resolved.StartsWith($top + [System.IO.Path]::DirectorySeparatorChar, [System.StringComparison]::OrdinalIgnoreCase))
                  if (-not $inside -or -not (Test-Path -LiteralPath $resolved)) {
                    Write-Output "::error::$($port.Name): $relative is a link to '$target', which isn't inside its own source, so what it points at wouldn't be scanned"
                    $failed = $true
                  } else {
                    $where = if ($resolved.Length -gt $top.Length) { $resolved.Substring($top.Length + 1) } else { 'the top of its own source' }
                    Write-Output "::notice::$($port.Name): $relative is a $($item.LinkType) to $where, which is scanned where it is"
                  }
                  $links++
                  continue
                }
                $to = Join-Path $out (Join-Path $port.Name (Join-Path $d.Name $relative))
                if ($item.PSIsContainer) {
                  New-Item -ItemType Directory -Force $to | Out-Null
                } else {
                  New-Item -ItemType Directory -Force (Split-Path -Parent $to) | Out-Null
                  Copy-Item -LiteralPath $item.FullName -Destination $to
                  $copied++
                }
              }
              "$($port.Name)/$($d.Name): $copied files copied, $links links written down"
            }
          }
          if ($failed) { exit 1 }

      - name: Hand the sources to the scan job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcpkg-library-sources
          path: ${{ runner.temp }}/libsrc
          # Without this the upload silently leaves out hidden files. Source in a hidden folder would go unscanned, and
          # the check for .snyk files in the next job could never find one.
          include-hidden-files: true
          retention-days: 1

  vcpkg-scan:
    name: Snyk on the vcpkg libraries
    needs: [vcpkg-changes, vcpkg-sources]
    # GitHub counts a skipped job as a passing check, so without this a failed library build would skip this job and
    # let the pull request through unscanned. always() makes it run anyway: with no sources to download, it fails.
    # It always gives an answer, so the required check never waits: it passes at once, saying why, when no library changed, and
    # it fails if whether they changed couldn't be worked out.
    if: ${{ always() }}
    runs-on: ubuntu-24.04   # pinned, so a runner-image migration never changes the security gate
    steps:
      - name: Say whether this run scans the libraries
        id: decide
        env:
          CHANGES: ${{ needs.vcpkg-changes.result }}
          FULL: ${{ needs.vcpkg-changes.outputs.full }}
          WHY: ${{ needs.vcpkg-changes.outputs.why }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Whether the libraries changed couldn't be worked out, so nothing is let through unscanned"
            exit 1
          fi
          echo "Scanning the libraries in full: $FULL ($WHY)"
          echo "scan=$FULL" >> "$GITHUB_OUTPUT"

      - name: Check out the accepted-reports list
        if: steps.decide.outputs.scan == 'yes'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      - name: Download the collected sources
        if: steps.decide.outputs.scan == 'yes'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vcpkg-library-sources
          path: libsrc

      - name: Install the pinned Snyk CLI
        if: steps.decide.outputs.scan == 'yes'
        run: |
          curl -fsSL "https://downloads.snyk.io/cli/$SNYK_CLI_VERSION/snyk-linux" -o "$RUNNER_TEMP/snyk"
          echo "$SNYK_CLI_SHA256  $RUNNER_TEMP/snyk" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/snyk"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The libraries Snyk Open Source can't recognise (mlkem-native and mldsa-native v2.0.0: #174) get their known vulnerabilities
      # from their projects' own GitHub security advisories instead, checked by machine: the owner's decision, 2026-11-09. Snyk has
      # been asked to index them too. tools/check-advisories.ps1 says what it checks, and what "read" means; .github/advisories-read.json
      # is where a read is written down. First its own test, with made-up advisories and no network, then the real check. The libraries
      # it passes, written to a file, are the only ones the scan below lets through as "not recognised", and only in this run. Added
      # 2026-11-09 by Melanikus for the AvP port.
      - name: Test the advisories check
        if: steps.decide.outputs.scan == 'yes'
        shell: pwsh
        run: ./repo/tests/advisories-test.ps1

      - name: Known vulnerabilities from the projects' own advisories, for the libraries Snyk can't recognise
        if: steps.decide.outputs.scan == 'yes'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./repo/tools/check-advisories.ps1 -Repository repo -Passed (Join-Path $env:RUNNER_TEMP 'advisories-passed.txt')

      # Every library that was collected is scanned, even if an earlier one fails, so one run shows everything; the job
      # fails at the end if any scan found anything. The eight we know of must be present by name, so a broken hand-over
      # can't pass as clean, and a new library is scanned without anyone adding it here. No library may carry a comment or
      # a settings file that tells a scanner to look away. It runs even if the advisories check failed, so the run still shows every
      # scan; then nothing is let through as "not recognised".
      - name: SAST and SCA on each library's source
        if: ${{ !cancelled() && steps.decide.outputs.scan == 'yes' }}
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p results
          failed=0
          # Snyk exits 0 for clean, 1 for findings, 2 or more for an error such as an API timeout. Only an error is
          # retried, and it still fails if it never clears: a scan that didn't finish is not a clean scan.
          code_scan() {
            local attempt rc
            for attempt in 1 2 3; do
              if snyk code test "$1" --sarif-file-output="$2"; then return 0; else rc=$?; fi
              if [ "$rc" -eq 1 ]; then return 1; fi
              echo "Snyk Code error (exit $rc) on attempt $attempt"
              sleep 30
            done
            return "$rc"
          }
          for lib in enet fmt libogg libvorbis mldsa-native mlkem-native openal-soft pthreads; do
            if [ ! -d "libsrc/$lib" ]; then
              echo "::error::No source collected for $lib"
              failed=1
            fi
          done
          for libdir in libsrc/*/; do
            lib=$(basename "$libdir")
            echo "================ $lib"
            dirs=$(find "libsrc/$lib" -mindepth 1 -maxdepth 1 -type d 2>/dev/null || true)
            if [ -z "$dirs" ]; then
              echo "::error::No source collected for $lib"
              failed=1
              continue
            fi
            for d in $dirs; do
              # Each source folder gets its own reports, so a library with two folders can't overwrite one with the other.
              name="$lib.$(basename "$d")"
              if grep -rIliE 'deepcode ignore|snyk:ignore' "$d"; then
                echo "::error::$lib has a comment that suppresses a scanner"
                failed=1
              fi
              settings=$(find "$d" \( -name .snyk -o -name .dcignore \) -print)
              if [ -n "$settings" ]; then
                echo "$settings"
                echo "::error::$lib has a file that tells a scanner to look away"
                failed=1
              fi
              if ! code_scan "$d" "results/$name.code.sarif"; then failed=1; fi
              for attempt in 1 2 3; do
                if (cd "$d" && snyk test --unmanaged --print-dep-paths --json-file-output="$GITHUB_WORKSPACE/results/$name.sca.json") | tee sca.log; then rc=0; else rc=$?; fi
                if [ "$rc" -lt 2 ]; then break; fi
                echo "Snyk Open Source error (exit $rc) on attempt $attempt"
                sleep 30
              done
              # The one exception in this gate: .github/snyk-accepted.json lists 4 reports by ID, for one library, with
              # an expiry date, and says why. Any other report, or any report after that date, still fails. It stays shut
              # if its own data is wrong: the expiry must be a real date, and Snyk's report must list something, because
              # an empty or unreadable report has not shown that only the accepted IDs were found.
              if [ "$rc" -eq 1 ] && [ "$lib" = "$(jq -r .library repo/.github/snyk-accepted.json)" ]; then
                expires=$(jq -r .expires repo/.github/snyk-accepted.json)
                found=$(jq -r 'if type == "array" then .[] else . end | .vulnerabilities[]?.id' "results/$name.sca.json" | sort -u || true)
                other=$(comm -23 <(printf '%s\n' "$found") <(jq -r '.reports[]' repo/.github/snyk-accepted.json | sort -u))
                if [[ "$expires" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [ "$(date -u -d "$expires" +%F)" = "$expires" ] && \
                   [ "$(date -u +%F)" \< "$expires" ] && [ -n "$found" ] && [ -z "$other" ]; then
                  echo "::warning::$lib: only the accepted reports were found (see .github/snyk-accepted.json)"
                  rc=0
                fi
              fi
              if [ "$rc" -ne 0 ]; then failed=1; fi
              tested=$(grep -oE 'Tested [0-9]+ dependenc' sca.log | grep -oE '[0-9]+' || echo 0)
              if [ "$tested" -lt 1 ]; then
                # Only a library whose own advisories passed the check above, in this run (the whole name, one a line)
                if [ -f "$RUNNER_TEMP/advisories-passed.txt" ] && grep -qxF -- "$lib" "$RUNNER_TEMP/advisories-passed.txt"; then
                  echo "::notice::Snyk Open Source doesn't recognise $lib, so its known vulnerabilities came from its project's own advisories, checked above"
                else
                  echo "::error::Snyk Open Source did not recognise $lib"
                  failed=1
                fi
              fi
            done
          done
          exit $failed

      - name: Keep the reports
        if: ${{ !cancelled() && steps.decide.outputs.scan == 'yes' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcpkg-scan-results
          path: results
          retention-days: 7
