# PROBE (temporary branch ci-coverage-probe, never merged): build the vcpkg libraries the game uses on Windows, keep the
# exact (patched) sources that get compiled, and run Snyk SAST + SCA on each library's source on Linux. It reports and
# never gates; the real gating jobs are written from what this shows.
name: Snyk coverage probe

on:
  workflow_dispatch:
    inputs:
      probe:
        description: which probe to run
        type: choice
        options: [vcpkg, parse]
        default: vcpkg

permissions:
  contents: read

jobs:
  vcpkg-sources:
    name: Build the vcpkg libraries and collect their sources
    if: inputs.probe == 'vcpkg'
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get vcpkg at the manifest's builtin-baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git init -q $root
          git -C $root fetch -q --depth 1 https://github.com/microsoft/vcpkg.git $baseline
          git -C $root checkout -q FETCH_HEAD
          "vcpkg registry commit: $(git -C $root rev-parse HEAD)"
          "== scripts\vcpkg-tool-metadata.txt"
          Get-Content (Join-Path $root 'scripts\vcpkg-tool-metadata.txt')
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          "== vcpkg.exe SHA512: $((Get-FileHash -Algorithm SHA512 (Join-Path $root 'vcpkg.exe')).Hash)"
          "VCPKG_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install the pinned libraries (x86-windows), keeping their build trees
        shell: pwsh
        run: |
          $bt = Join-Path $env:RUNNER_TEMP 'bt'
          & (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') install --triplet x86-windows `
            --x-install-root="$env:RUNNER_TEMP\installed" --x-buildtrees-root="$bt" --disable-metrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') list --x-install-root="$env:RUNNER_TEMP\installed"

      - name: Collect each port's source directories
        shell: pwsh
        run: |
          $bt = Join-Path $env:RUNNER_TEMP 'bt'
          $out = Join-Path $env:RUNNER_TEMP 'libsrc'
          New-Item -ItemType Directory -Force $out | Out-Null
          foreach ($port in Get-ChildItem $bt -Directory) {
            $src = Join-Path $port.FullName 'src'
            if (-not (Test-Path $src)) { "$($port.Name): no src directory (binary-only or script port)"; continue }
            foreach ($d in Get-ChildItem $src -Directory) {
              $dest = Join-Path $out (Join-Path $port.Name $d.Name)
              Copy-Item -Recurse $d.FullName $dest
              $n = (Get-ChildItem -Recurse -File $dest | Measure-Object).Count
              "$($port.Name)/$($d.Name): $n files"
            }
          }

      - name: Upload the collected sources for the scan job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcpkg-library-sources
          path: ${{ runner.temp }}/libsrc
          retention-days: 1

  vcpkg-scan:
    name: Snyk SAST + SCA on each library's source
    needs: vcpkg-sources
    if: inputs.probe == 'vcpkg'
    runs-on: ubuntu-24.04
    steps:
      - name: Download the collected sources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vcpkg-library-sources
          path: libsrc

      - name: Install the Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master, 2026-10-07

      - name: Scan each source directory
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          mkdir -p results
          for d in libsrc/*/*/; do
            d=${d%/}
            lib=$(basename "$(dirname "$d")")
            echo "================ $d ($(find "$d" -type f | wc -l) files)"
            snyk code test "$d" --sarif-file-output="results/$lib.code.sarif" > /dev/null 2>&1 || true
            if [ -f "results/$lib.code.sarif" ]; then
              echo "-- SAST coverage: $(jq -c '.runs[0].properties.coverage // "none"' "results/$lib.code.sarif")"
              echo "-- SAST results by rule:"
              jq -r '.runs[0].results[].ruleId' "results/$lib.code.sarif" | sort | uniq -c
            else
              echo "-- SAST: no SARIF written"
            fi
            echo "-- SCA (--unmanaged):"
            (cd "$d" && snyk test --unmanaged --json > "$GITHUB_WORKSPACE/results/$lib.sca.json" 2>/dev/null) || true
            jq -r '.vulnerabilities[]? | "  " + .severity + "  " + .id + "  " + .title + "  CVE: " + ((.identifiers.CVE // []) | join(",")) + "  fixed in: " + ((.fixedIn // []) | join(","))' "results/$lib.sca.json" 2>/dev/null | sort -u
          done

      - name: Keep the full reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcpkg-scan-results
          path: results
          retention-days: 7

  parse-probe:
    name: Find the files Snyk Code cannot parse
    if: inputs.probe == 'parse'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master, 2026-10-07

      - name: Folder by folder, then file by file
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          failed_count() {   # $1 = a directory; prints how many files Snyk Code could not parse there
            snyk code test "$1" --sarif-file-output=p.sarif > /dev/null 2>&1 || true
            if [ -f p.sarif ]; then
              jq '[.runs[0].properties.coverage[]? | select(.type == "FAILED_PARSING") | .files] | add // 0' p.sarif
              rm -f p.sarif
            else
              echo "no-sarif"
            fi
          }
          git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.inl' > files.txt
          total=0
          for dir in $(xargs -n1 dirname < files.txt | sort -u); do
            rm -rf /tmp/one && mkdir -p /tmp/one
            grep -E "^$dir/[^/]+$" files.txt | while read -r f; do cp "$f" /tmp/one/; done
            n=$(failed_count /tmp/one)
            echo "folder $dir: $(ls /tmp/one | wc -l) files, failed parsing: $n"
            if [ "$n" != "0" ]; then
              for f in $(grep -E "^$dir/[^/]+$" files.txt); do
                rm -rf /tmp/single && mkdir -p /tmp/single && cp "$f" /tmp/single/
                m=$(failed_count /tmp/single)
                if [ "$m" != "0" ]; then echo "  FAILS TO PARSE: $f ($m)"; fi
              done
            fi
          done
