# PROBE (temporary branch ci-coverage-probe, never merged): measure what Snyk Code and Snyk Open Source actually cover.
# Same pinned actions and permissions as the real workflow. It reports and never uploads anything; nothing here gates.
name: Snyk coverage probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-code:
    name: Probe Snyk Code coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master, 2026-10-07

      - name: Count the C/C++ files git tracks, per top-level folder
        run: |
          git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.inl' | cut -d/ -f1 | sort | uniq -c
          echo "total: $(git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.inl' | wc -l)"

      - name: Snyk Code on the whole repository (coverage only)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk code test --sarif-file-output=whole.sarif > /dev/null || true
          echo "== coverage reported by Snyk Code (whole repository)"
          jq -c '.runs[0].properties // "no run properties"' whole.sarif
          echo "== results per top-level folder"
          jq -r '.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri' whole.sarif | cut -d/ -f1 | sort | uniq -c

      - name: Snyk Code on dependencies/ and enet/ alone
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          for d in dependencies enet; do
            snyk code test "$d" --sarif-file-output="$d.sarif" > /dev/null || true
            echo "== $d: coverage"
            jq -c '.runs[0].properties // "no run properties"' "$d.sarif" 2>/dev/null || echo "no SARIF written for $d"
            echo "== $d: results by rule"
            jq -r '.runs[0].results[].ruleId' "$d.sarif" 2>/dev/null | sort | uniq -c
          done

  probe-open-source:
    name: Probe Snyk Open Source coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master, 2026-10-07

      - name: Snyk Open Source --unmanaged, with the files behind each identified library
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --unmanaged --print-dep-paths || true
