# Shows that the tests notice broken code, on a clean machine. Written 2026-11-07 by Melanikus for the AvP port.
#
# Each list in tests/takeouts/<test>.json is a set of rows, and each row breaks one thing in a copy of the code. The runner beside the lists
# (tests/takeouts/run.ps1) builds the test against that broken copy and runs it, and the test has to fail. A row the test still passes on,
# or one that can't be run any more because the code has moved on, fails this check. tests/takeouts/README.md says more.
#
# It runs only by hand (Actions, Take-outs, Run workflow), on the lists named or on all of them, and never on a pull request or a merge.
# The owner's ruling R-BLD-11 (2026-11-14): "take outs don't need to run all the fucking time, it's a hardening thing we need to do like
# once and get everyone to fix", and "I rather the team focus on fixing takeouts before releases". So the team runs every list once on a
# release candidate and fixes what it finds, and a release can't be made without that: tools/check-release.ps1 refuses a release whose
# commit has no passing "Take-outs (all lists)" run. Each list runs on its own machine, at the same time as the others, because a list can
# take an hour.
#
# The job that decides whether this passes is the last one. It fails if choosing the lists failed, or any list did. Its name is
# "Take-outs (all lists)" when every list ran, and "Take-outs" when only some did, so a release can tell a full run from a partial one.

name: Take-outs

on:
  workflow_dispatch:
    inputs:
      lists:
        description: 'Which lists to run: their names without .json, separated by spaces, or "all"'
        required: true
        default: 'all'

permissions:
  contents: read

jobs:
  choose:
    name: Choose the lists
    runs-on: windows-2025-vs2026   # pinned: Windows Server 2025 with Visual Studio 2026, the compiler we build with
    outputs:
      lists: ${{ steps.choose.outputs.lists }}
      count: ${{ steps.choose.outputs.count }}
      all: ${{ steps.choose.outputs.all }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner checks every name a list, or a test's settings, gives it before it copies or changes anything by it. This shows those
      # checks refuse each name they should, for its own reason, and take the good ones, before any list runs. It works on a made-up
      # folder of its own, and builds and runs nothing. (Added 2026-11-21, #163.)
      - name: Check the runner refuses the names it should
        shell: pwsh
        run: |
          ./tests/takeouts/run.ps1 -CheckRefusals
          exit $LASTEXITCODE

      # What was typed by hand comes in as plain text in the environment. It's never pasted into the script itself, so nothing typed can
      # become part of it.
      - name: Choose the lists
        id: choose
        shell: pwsh
        env:
          ASKED: ${{ github.event.inputs.lists }}
        run: |
          # A list's name is only letters, digits and underscores, the way every test here is named. Anything else is refused.
          $all = @(Get-ChildItem tests/takeouts -Filter *.json | ForEach-Object { $_.BaseName } | Sort-Object)
          foreach ($name in $all) {
            if ($name -cnotmatch '^[A-Za-z0-9_]+$') { throw "tests/takeouts/$name.json isn't named the way a test is" }
          }

          $asked = "$env:ASKED".Trim()
          if ($asked -eq 'all') {
            $chosen = $all
          }
          else {
            $chosen = @($asked -split '[\s,]+' | Where-Object { $_ })
            foreach ($name in $chosen) {
              if ($all -cnotcontains $name) { throw "There's no take-out list called $name" }
            }
          }
          if ($chosen.Count -eq 0) { throw 'No list was named' }

          # "All" means every list there is, each once. A release asks for a run of all of them (R-BLD-11), so this is worked out from
          # the lists themselves, not from what was typed.
          $everyList = @($all | Where-Object { $chosen -ccontains $_ }).Count -eq $all.Count

          "These lists run: $($chosen -join ', ')$(if ($everyList) { ' (all of them)' })"
          # Written out by hand, because ConvertTo-Json writes a list of one or none differently in different versions. Every name is
          # letters, digits and underscores, checked above, so nothing in one needs escaping.
          "lists=[$(($chosen | ForEach-Object { '"' + $_ + '"' }) -join ',')]" >> $env:GITHUB_OUTPUT
          "count=$($chosen.Count)" >> $env:GITHUB_OUTPUT
          "all=$(if ($everyList) { 'yes' } else { 'no' })" >> $env:GITHUB_OUTPUT

  run:
    name: Take-outs for ${{ matrix.list }}
    needs: choose
    if: needs.choose.outputs.count != '0'
    runs-on: windows-2025-vs2026
    timeout-minutes: 300
    strategy:
      fail-fast: false   # one list failing doesn't stop the others, so a run shows every list that needs work
      # GitHub Pro runs up to 40 jobs at once for this account. 30 leaves room for the other checks of the same pull request
      # (build, tests, Snyk), so the take-out lists, which are the slowest part of a run, finish sooner. It costs nothing more on a
      # public repository.
      max-parallel: 30
      matrix:
        list: ${{ fromJSON(needs.choose.outputs.lists) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A test that links one of the game's own libraries names vcpkg_installed in its settings (net_close_test links our ENet),
      # and the runner copies exactly those files into its copy of the code. So they're fetched first, by the same action and with
      # the same ports as the Tests check, so both checks build a test against the same libraries. A list whose test names
      # nothing there skips this.
      - name: See whether this list's test links the game's libraries
        id: libraries
        shell: pwsh
        env:
          LIST: ${{ matrix.list }}
        run: |
          $settings = "tests/$($env:LIST).args"
          $links = (Test-Path -LiteralPath $settings) -and ((Get-Content -LiteralPath $settings -Raw) -match 'vcpkg_installed')
          "It links the game's libraries: $links"
          "links=$(if ($links) { 'yes' } else { 'no' })" >> $env:GITHUB_OUTPUT

      - name: Fetch the game's libraries the test links
        if: steps.libraries.outputs.links == 'yes'
        uses: ./.github/actions/fetch-test-libraries
        with:
          ports: dxsdk-d3dx enet mldsa-native mlkem-native

      # The runner says how each row went, and gives back a non-zero result if any row wasn't noticed or couldn't be run. A list
      # whose test isn't here at all can't be run either, and fails the same way.
      - name: Run the list
        shell: pwsh
        env:
          LIST: ${{ matrix.list }}
        run: |
          if (-not (Test-Path "tests/$($env:LIST).args")) { throw "tests/takeouts/$($env:LIST).json is a list for a test that isn't here: there's no tests/$($env:LIST).args" }
          ./tests/takeouts/run.ps1 $env:LIST
          exit $LASTEXITCODE

  # One job that says how the run went. It passes only if the lists were chosen, and every list that ran passed. Its name says whether
  # every list ran: tools/check-release.ps1 refuses a release unless "Take-outs (all lists)" passed on the release's commit (R-BLD-11).
  result:
    name: ${{ needs.choose.outputs.all == 'yes' && 'Take-outs (all lists)' || 'Take-outs' }}
    needs: [choose, run]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Say how it went
        env:
          CHOSE: ${{ needs.choose.result }}
          RAN: ${{ needs.run.result }}
        run: |
          echo "Choosing the lists: $CHOSE. Running them: $RAN."
          if [ "$CHOSE" != "success" ]; then echo "The lists couldn't be chosen"; exit 1; fi
          if [ "$RAN" != "success" ] && [ "$RAN" != "skipped" ]; then
            echo "At least one list has a row its test didn't notice, or couldn't run. The failed list's own job says which row, and why."
            echo "tests/takeouts/README.md, under \"When the Take-outs check fails\", says what to do."
            exit 1
          fi
          echo "Every list that ran is noticed, row by row"
