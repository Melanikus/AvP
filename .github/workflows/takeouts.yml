# Shows that the tests notice broken code, on a clean machine. Written 2026-11-07 by Melanikus for the AvP port.
#
# Each list in tests/takeouts/<test>.json is a set of rows, and each row breaks one thing in a copy of the code. The runner beside the lists
# (tests/takeouts/run.ps1) builds the test against that broken copy and runs it, and the test has to fail. A row the test still passes on,
# or one that can't be run any more because the code has moved on, fails this check. tests/takeouts/README.md says more.
#
# On a pull request this runs the lists the pull request can affect: those whose list, test, settings or stand-ins it changes, or which
# break a file it changes. A pull request that changes this file, the runner, tests/every_test/, or any header (a .h or .hpp file) runs
# every list. By hand (Actions, Take-outs, Run workflow)
# it runs the lists named, or all of them. The lists are shared into a few batches, one machine each, by tests/takeouts/share.ps1, and a long
# list is cut into pieces of its rows; tests/takeouts/run-batch.ps1 runs a batch.
#
# The job that decides whether this passes is the last one, "Take-outs": it fails if choosing the lists failed, or any list did.

name: Take-outs

on:
  pull_request:
    branches: [avpx_main]
  workflow_dispatch:
    inputs:
      lists:
        description: 'Which lists to run: their names without .json, separated by spaces, or "all"'
        required: true
        default: 'all'

permissions:
  contents: read

# One run at a time for each pull request, and for each branch a run is started on by hand. Here a newer run WAITS for the one going
# to finish, and never stops it: on 2026-11-11 runs of this check stopped half-way, with jobs still queued, left those jobs stuck where
# nothing could cancel or delete them, holding the account's runners, and new runs couldn't start at all. GitHub keeps one waiting run
# for a group: a third run replaces the one waiting, before any of its jobs is queued. This doesn't limit several branches at once;
# fewer jobs per run is the next step of the plan. Added 2026-11-11 by Melanikus for the AvP port.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  choose:
    name: Choose the lists
    runs-on: windows-2025-vs2026   # pinned: Windows Server 2025 with Visual Studio 2026, the compiler we build with
    timeout-minutes: 10   # it only reads the code; 10 is the least any job here is given
    outputs:
      lists: ${{ steps.choose.outputs.lists }}
      count: ${{ steps.choose.outputs.count }}
      batches: ${{ steps.choose.outputs.batches }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the whole history, so that what the pull request changes can be seen

      # What was typed by hand, and the commit a pull request goes into, come in as plain text in the environment. They're never
      # pasted into the script itself, so nothing typed can become part of it.
      - name: Choose the lists
        id: choose
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        env:
          ASKED: ${{ github.event.inputs.lists }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # A list's name is only letters, digits and underscores, the way every test here is named. Anything else is refused.
          $all = @(Get-ChildItem tests/takeouts -Filter *.json | ForEach-Object { $_.BaseName } | Sort-Object)
          foreach ($name in $all) {
            if ($name -cnotmatch '^[A-Za-z0-9_]+$') { throw "tests/takeouts/$name.json isn't named the way a test is" }
          }

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $asked = "$env:ASKED".Trim()
            if ($asked -eq 'all') {
              $chosen = $all
            }
            else {
              $chosen = @($asked -split '[\s,]+' | Where-Object { $_ })
              foreach ($name in $chosen) {
                if ($all -cnotcontains $name) { throw "There's no take-out list called $name" }
              }
            }
          }
          else {
            if ($env:BASE -cnotmatch '^[0-9a-f]{40}$') { throw 'This pull request has no commit to compare with' }
            $changed = @(git diff --name-only "$($env:BASE)...HEAD")
            if ($LASTEXITCODE -ne 0) { throw "Couldn't see what this pull request changes" }

            # A change to this check, to the runner (run.ps1, and share.ps1 and run-batch.ps1, added 2026-11-11), or to the guard every test reads first (tests/every_test/, #140) is tried on every
            # list, so none of them is ever changed untested. (The rule for tests/every_test/ is from the unmerged branch stl-harden, 28767cc3.)
            $checkerChanged = @($changed | Where-Object { $_ -ceq '.github/workflows/takeouts.yml' -or $_ -ceq 'tests/takeouts/run.ps1' -or $_ -ceq 'tests/takeouts/share.ps1' -or $_ -ceq 'tests/takeouts/run-batch.ps1' -or $_.StartsWith('tests/every_test/') }).Count -gt 0

            # A header can change what any test compiles, or the code a test checks, and the lists below are chosen by the files they
            # name, which never follow an #include. On avpx_main a2b5a253, 93 of the 129 lists would have been left out by a pull
            # request changing only one header their test's own files include, tests/source_slice.h among them (#226). So a header
            # change is tried on every list, until each list is chosen by everything its test compiles. Added 2026-11-11 by Melanikus
            # for the AvP port.
            $headers = @($changed | Where-Object { $_ -match '\.(h|hpp)$' })
            if ($headers.Count -gt 0) { "Every list runs, because this pull request changes a header: $($headers -join ', ')" }

            $chosen = if ($checkerChanged -or $headers.Count -gt 0) { $all } else { @(foreach ($name in $all) {
              # The list, the test and its settings, its stand-ins, every source file its settings name, and every file its rows break
              $files = @("tests/takeouts/$name.json", "tests/$name.cpp", "tests/$name.args")
              if (Test-Path "tests/$name.args") {
                $files += @(Get-Content "tests/$name.args" | ForEach-Object { $_ -split '\s+' } | Where-Object { $_ -match '^[\w./-]+\.(c|cpp|h|hpp)$' })
              }
              $list = Get-Content "tests/takeouts/$name.json" -Raw | ConvertFrom-Json
              $files += @($list.rows | ForEach-Object { $_.changes } | ForEach-Object { $_.file })

              $touched = @($changed | Where-Object { ($files -ccontains $_) -or $_.StartsWith("tests/$($name)_stubs/") })
              if ($touched.Count -gt 0) { $name }
            }) }
          }

          "These lists run: $(if ($chosen.Count) { $chosen -join ', ' } else { 'none, because nothing they cover has changed' })"
          # Written out by hand, because ConvertTo-Json writes a list of one or none differently in different versions. Every name is
          # letters, digits and underscores, checked above, so nothing in one needs escaping.
          "lists=[$(($chosen | ForEach-Object { '"' + $_ + '"' }) -join ',')]" >> $env:GITHUB_OUTPUT
          "count=$($chosen.Count)" >> $env:GITHUB_OUTPUT

          # The lists, shared into a few batches, one machine each (tests/takeouts/share.ps1 says how). Its last line is the output.
          if ($chosen.Count -gt 0) {
            $shared = @(& ./tests/takeouts/share.ps1 -Lists ($chosen -join ' '))
            $shared | Select-Object -SkipLast 1
            $last = $shared[-1]
            if ("$last" -cnotmatch '^batches=\[\{') { throw "share.ps1 didn't end with the batches: $last" }
            $last >> $env:GITHUB_OUTPUT
          }
          else { 'batches=[]' >> $env:GITHUB_OUTPUT }

  run:
    name: Take-outs, batch ${{ matrix.batch.n }} of ${{ matrix.batch.of }}
    needs: choose
    if: needs.choose.outputs.count != '0'
    runs-on: windows-2025-vs2026
    # share.ps1 gives each batch about three times its minutes, at least 30, from the time each list took when it last ran on a machine
    # of its own (.github/takeouts-minutes.json), so a runner that's lost frees its place, never after GitHub's 6 hours. A batch that
    # outgrows its limit fails, and its log says which list it was on. Modified 2026-11-11 by Melanikus for the AvP port (it was one
    # machine a list).
    timeout-minutes: ${{ matrix.batch.limit }}
    strategy:
      fail-fast: false   # one batch failing doesn't stop the others, so a run shows every list that needs work
      matrix:
        batch: ${{ fromJSON(needs.choose.outputs.batches) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A test that links one of the game's own libraries names vcpkg_installed in its settings (net_close_test links our ENet),
      # and the runner copies exactly those files into its copy of the code. So they're fetched first, by the same action and with
      # the same ports as the Tests check, so both checks build a test against the same libraries. A batch none of whose tests
      # names anything there skips this.
      - name: See whether any list in this batch links the game's libraries
        id: libraries
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        env:
          ITEMS: ${{ matrix.batch.items }}
        run: |
          $links = $false
          foreach ($item in @("$env:ITEMS" -split '\s+' | Where-Object { $_ })) {
            if ($item -cnotmatch '^([A-Za-z0-9_]+):') { throw "An item is a list's name, its first row and its last, and this isn't: $item" }
            $settings = "tests/$($Matches[1]).args"
            if ((Test-Path -LiteralPath $settings) -and ((Get-Content -LiteralPath $settings -Raw) -match 'vcpkg_installed')) { $links = $true }
          }
          "A test in this batch links the game's libraries: $links"
          "links=$(if ($links) { 'yes' } else { 'no' })" >> $env:GITHUB_OUTPUT

      - name: Fetch the game's libraries the tests link
        if: steps.libraries.outputs.links == 'yes'
        uses: ./.github/actions/fetch-test-libraries
        with:
          ports: dxsdk-d3dx enet mldsa-native mlkem-native

      # run-batch.ps1 runs each list of the batch through run.ps1, in a PowerShell of its own, every one even after one fails, and
      # gives back 1 if any row wasn't noticed or couldn't be run, naming each list. A list whose test isn't here fails the same way.
      - name: Run this batch's lists
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        env:
          ITEMS: ${{ matrix.batch.items }}
        run: |
          ./tests/takeouts/run-batch.ps1 -Items "$env:ITEMS"
          exit $LASTEXITCODE

  # One job with one name, to make a required check of. It passes only if the lists were chosen, and every list that ran passed.
  # When nothing a list covers has changed, no list runs, and that passes.
  result:
    name: Take-outs
    needs: [choose, run]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10   # it only reads the other jobs' results
    steps:
      - name: Say how it went
        env:
          CHOSE: ${{ needs.choose.result }}
          RAN: ${{ needs.run.result }}
        run: |
          echo "Choosing the lists: $CHOSE. Running them: $RAN."
          if [ "$CHOSE" != "success" ]; then echo "The lists couldn't be chosen"; exit 1; fi
          if [ "$RAN" != "success" ] && [ "$RAN" != "skipped" ]; then
            echo "At least one list has a row its test didn't notice, or couldn't run. The failed batch's own job says which list and row, and why."
            echo "tests/takeouts/README.md, under \"When the Take-outs check fails\", says what to do."
            exit 1
          fi
          echo "Every list that ran is noticed, row by row"
