# Runs the unit tests in tests/. A test that fails or doesn't build stops the merge, for everyone. This is a required check.
#
# Each test is a small program that returns 0 only if every check in it passed. tests/build.ps1 explains how to add one, and
# a new test runs here with no change to this file. How much of the code the tests cover is not a gate: only a failing test is.
name: Tests

on:
  push:
    branches: [avpx_main]
  pull_request:
    branches: [avpx_main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: windows-2025-vs2026   # pinned: Windows Server 2025 with Visual Studio 2026, the compiler we build with
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Neither of our code scanners can read shaders, so this is the gate they get. A warning fails it, as an error does.
      - name: Compile every shader
        shell: pwsh
        run: ./tests/compile-shaders.ps1

      # Some tests use the game's own libraries, and only those: this job doesn't build the game. The shader test compiles with the
      # library the game does, and the network tests link the game's ENet, so both come before the tests are built. The registry
      # commit is the builtin-baseline in vcpkg.json, the same as a real build, and our own patched ports are used where we have them.
      - name: Fetch the game's shader compiler and ENet
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git init -q $root
          git -C $root fetch -q --depth 1 https://github.com/microsoft/vcpkg.git $baseline
          git -C $root checkout -q FETCH_HEAD
          if ((git -C $root rev-parse HEAD) -ne $baseline) { throw 'vcpkg is not at the manifest baseline' }
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $root 'vcpkg.exe') install dxsdk-d3dx:x86-windows enet:x86-windows --classic --overlay-ports=vcpkg-overlay-ports --x-install-root=vcpkg_installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the tests
        shell: pwsh
        run: ./tests/build.ps1

      # With no tests at all this fails, so a broken build script can't pass as "every test passed".
      - name: Run every test
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem "$env:RUNNER_TEMP\avp-tests\*.exe")
          if ($tests.Count -eq 0) { throw 'No tests were built' }
          foreach ($test in $tests) {
            "Running $($test.Name)"
            & $test.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # Not a program like the others: it runs the release checks on made-up folders, and reads the release workflow.
      - name: Test the release checks
        shell: pwsh
        run: ./tests/release-test.ps1
