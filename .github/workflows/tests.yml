# Runs the unit tests in tests/. A test that fails or doesn't build stops the merge, for everyone. This is a required check.
#
# Each test is a small program that returns 0 only if every check in it passed. tests/build.ps1 explains how to add one, and
# a new test runs here with no change to this file. How much of the code the tests cover is not a gate: only a failing test is.
name: Tests

on:
  push:
    branches: [avpx_main]
  pull_request:
    branches: [avpx_main]
  workflow_dispatch:
  # Every night, on avpx_main: it reuses nothing and runs every test, and checks that each result a run WOULD have reused passes again
  # here (tests/reuse/record.ps1 -Compare). If one doesn't, a key missed something, and the night run fails, naming it. Added 2026-11-11
  # by Melanikus for the AvP port (the CI plan's step 4).
  schedule:
    - cron: "41 5 * * *"

permissions:
  contents: read

# One run at a time for each pull request, and for each branch a run is started on by hand. A newer run there WAITS for the one going
# to finish, and never stops it: on 2026-11-11 runs stopped half-way, with jobs still queued, left those jobs stuck where nothing could
# cancel or delete them, holding every runner the account has, and new runs couldn't start at all. A run that's overtaken only costs
# minutes; a stuck one costs the whole account (PO). GitHub keeps one waiting run for a group: a third replaces the one waiting, before
# any of its jobs is queued. A push to avpx_main gets a group of its own: each merge keeps its own result, and never waits for another.
# Added 2026-11-11 by Melanikus for the AvP port.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit tests
    # A test that hangs fails here. Without a limit, it would hold up a runner for 6 hours.
    timeout-minutes: 30
    runs-on: windows-2025-vs2026   # pinned: Windows Server 2025 with Visual Studio 2026, the compiler we build with
    # actions: read, to list this workflow's earlier runs and download their records (tests/reuse/lookup.ps1). Nothing here can write or
    # record anything: the records are attested by the job "Record the tests' results", which runs none of this code.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the whole history, so lookup.ps1 can see which earlier commits this one was made from

      # Hudson is the team's test bot. Since 2026-11-09 it's in the game (the owner: "Hudson goes into avpx_main"), and this proves a player's
      # game can never run any of it: every way in does nothing unless -dev and -hudson asked for a run. It comes first, before anything is
      # built, so that a way in left awake fails the pull request that brings it. Until 2026-11-09 this was check-no-hudson.ps1.
      - name: Refuse any way a player's game could run Hudson
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        run: ./tools/check-hudson-asleep.ps1

      # The owner's ruling, 2026-11-09: "I want the code to test but NOTHING that can be actually accessed by people with the release".
      # The code that talks to our servers comes in as it's written, and runs only with -dev; this proves a player's game can reach none
      # of them. Only the owner lifts it.
      - name: Refuse any way a player's game could reach one of our servers
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        run: ./tools/check-servers-dev-only.ps1

      # Neither of our code scanners can read shaders, so this is the gate they get. A warning fails it, as an error does.
      - name: Compile every shader
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        run: ./tests/compile-shaders.ps1

      # Some tests use the game's own libraries, and only those: this job doesn't build the game. The shader test compiles with the
      # library the game does, the network tests link the game's ENet, and the post-quantum tests (pq_mlkem_test, pq_mldsa_test) link
      # mlkem-native and mldsa-native, so all of them come before the tests are built. The action says how they're made, the same way as
      # a real build, and the Take-outs check uses it too.
      - name: Fetch the game's shader compiler, ENet and the post-quantum libraries
        uses: ./.github/actions/fetch-test-libraries
        with:
          ports: dxsdk-d3dx enet mldsa-native mlkem-native

      # net_relay_test reads the relay's test vectors, a file the relay's repository makes from its own code (AVPx-Dedicated-Server,
      # test-vectors/relay-v1.json at 26d0580). The copy here has to be that file byte for byte: a copy changed to suit the game's code would
      # prove nothing. tests/vectors/README.md says how to take a newer one. Added 2026-11-08 by Melanikus for the AvP port.
      - name: Check the relay's test vectors are the relay's own
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        run: |
          $expected = 'c982ae7d94fcf8e0c71fe69180c01beae6fbd9aa6b5b998c010c2d3fdc5dc2f7'
          $found = (Get-FileHash -Algorithm SHA256 -LiteralPath tests/vectors/relay-v1.json).Hash.ToLowerInvariant()
          if ($found -ne $expected) { throw "tests/vectors/relay-v1.json isn't the relay's file: its sha256 is $found, not $expected" }
          "tests/vectors/relay-v1.json is the relay's file at 26d0580"

      # net_v2_parts_test and net_v2a_test read protocol version 2's test vectors, which the relay's Java makes from its own code
      # (AVPx-Dedicated-Server, test-vectors/crypto-v2.json at 2b8dcd6, Split's 48-byte secrets, made by java/test/avpx/v2/CryptoV2Vectors.java). As
      # relay-v1.json's: byte for byte, or it proves nothing. Added 2026-11-09 by Melanikus for the AvP port.
      - name: Check protocol version 2's test vectors are the relay's own
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        run: |
          $expected = '08f15401f7374a22c248b082a65c60b30486827e204cc7dbc187db983774ab17'
          $found = (Get-FileHash -Algorithm SHA256 -LiteralPath tests/vectors/crypto-v2.json).Hash.ToLowerInvariant()
          if ($found -ne $expected) { throw "tests/vectors/crypto-v2.json isn't the relay's file: its sha256 is $found, not $expected" }
          "tests/vectors/crypto-v2.json is the relay's file at 2b8dcd6"

      # net_crypto_test reads the published known answers for protocol v2's primitives (NIST CAVP and ACVP, and Wycheproof), copied byte
      # for byte from the relay's repository (AVPx-Dedicated-Server crypto-kat-java 0c4755cf, test-vectors/crypto-kat/; the folder's
      # COPIED.md says what and why). Every file's sha256 is in that folder's SHA256SUMS, and nothing unlisted may be there: a copy
      # changed to suit the game's code would prove nothing. Added 2026-11-09 by Melanikus for the AvP port.
      - name: Check the copied known answers are the relay's own
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        run: |
          $folder = 'tests/vectors/crypto-kat'
          $listed = @{}
          foreach ($line in Get-Content -LiteralPath "$folder/SHA256SUMS") {
            if ($line -notmatch '^([0-9a-f]{64})  (\S+)$') { throw "SHA256SUMS has a line that isn't a sum and a name: $line" }
            $expected = $Matches[1]
            $name = $Matches[2]
            $found = (Get-FileHash -Algorithm SHA256 -LiteralPath "$folder/$name").Hash.ToLowerInvariant()
            if ($found -ne $expected) { throw "$folder/$name isn't the relay's copy: its sha256 is $found, not $expected" }
            $listed[$name] = $true
          }
          # Nothing else is in the folder but these, the note and the list itself
          $root = (Resolve-Path -LiteralPath $folder).Path
          $extra = @(Get-ChildItem -LiteralPath $folder -Recurse -File | ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\', '/') } | Where-Object { -not $listed[$_] -and $_ -ne 'SHA256SUMS' -and $_ -ne 'COPIED.md' })
          if ($extra.Count -gt 0) { throw "tests/vectors/crypto-kat has files SHA256SUMS doesn't list: $($extra -join ', ')" }
          "$($listed.Count) copied known-answer files are the relay's own (crypto-kat-java 0c4755cf)"

      # The CI plan's step 4 (added 2026-11-11 by Melanikus for the AvP port; tests/reuse/Reuse.psm1 says what a key is). A test whose
      # earlier result is found, attested by this workflow on avpx_main and checked again here is not built or run, and the log says where
      # it ran. Any doubt, and it runs. The nightly run (schedule) reuses nothing: it only writes down what it WOULD have reused, to check
      # it after the tests.
      #
      # Everything this job does for the reuse happens BEFORE any test runs: the tests run with every right on this machine, and nothing
      # run here after them is believed (Secondary's attacker's readings, C1 and R1). The records themselves are worked out in a job of
      # their own, on another machine, from data alone: the lists kept below before any test ran, and the tests' pass or fail. The reuse
      # scripts run from a copy taken from the commit (git cat-file), into a folder of their own; this copy's words are here in the
      # workflow.
      - name: Take the reuse scripts from the commit
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        env:
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          $copy = Join-Path $env:RUNNER_TEMP 'reuse-scripts'
          if (Test-Path -LiteralPath $copy) { Remove-Item -Recurse -Force -LiteralPath $copy }
          New-Item -ItemType Directory -Force $copy | Out-Null
          if ("$(git rev-parse HEAD)".Trim() -cne $env:GITHUB_SHA) { throw "The checkout isn't at the commit this run is for ($env:GITHUB_SHA)" }
          foreach ($name in @(git ls-tree --name-only HEAD -- tests/reuse/)) {
            if ($name -cnotmatch '^tests/reuse/[A-Za-z0-9_.-]+$') { throw "tests/reuse/ holds something that isn't a plain file's name: $name" }
            $given = Start-Process -FilePath git -ArgumentList @('cat-file', 'blob', "HEAD:$name") -NoNewWindow -Wait -PassThru -RedirectStandardOutput (Join-Path $copy (Split-Path -Leaf $name))
            if ($given.ExitCode -ne 0) { throw "git couldn't give $name from the commit" }
          }
          "Copied from the commit: $(@(Get-ChildItem -LiteralPath $copy -File).Name -join ', ')"

      - name: Find earlier results to reuse
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ github.event_name == 'schedule' }}
        run: |
          $lookup = Join-Path $env:RUNNER_TEMP 'reuse-scripts\lookup.ps1'
          if ($env:DRY -eq 'true') { & $lookup -Root $env:GITHUB_WORKSPACE -Work "$env:RUNNER_TEMP\reuse" -Dry } else { & $lookup -Root $env:GITHUB_WORKSPACE -Work "$env:RUNNER_TEMP\reuse" }
          exit $LASTEXITCODE

      # The key's own rows: one change at a time must change the key, and lookup.ps1's checks must refuse what they should. Never reused.
      - name: Prove the reuse key notices each change, and the lookup refuses what it should
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $verified = "$((Get-Content -LiteralPath "$env:RUNNER_TEMP\reuse\plan.json" -Raw | ConvertFrom-Json).verifiedFile)"
          & (Join-Path $env:RUNNER_TEMP 'reuse-scripts\key-rows.ps1') -Verified $verified
          exit $LASTEXITCODE

      - name: Build the tests
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        run: |
          ./tests/build.ps1 -ShowIncludes -Skip "$env:RUNNER_TEMP\reuse\skip.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The machine's words go with the lists, for the job that works the records out on another machine
          Copy-Item -LiteralPath "$env:RUNNER_TEMP\reuse\machine.txt" -Destination "$env:RUNNER_TEMP\avp-tests\machine.txt"

      # What each test was built from and what its program imports, and the machine's words, kept straight after the build, before any test
      # has run, so no test can change them: the records are worked out from these, and checked against them. Only a run that can be a
      # source keeps them.
      - name: Keep what each test was built from, before any test runs
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/avpx_main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reuse-lists
          path: |
            ${{ runner.temp }}/avp-tests/*.includes.txt
            ${{ runner.temp }}/avp-tests/*.imports.txt
            ${{ runner.temp }}/avp-tests/machine.txt
          retention-days: 30
          if-no-files-found: error

      # Every test runs, even after one fails, and the step fails at the end naming each. With no tests built and none reused it fails, so
      # a broken build script can't pass as "every test passed". Whatever a test leaves running is stopped, and written down.
      - name: Run every test
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        run: |
          & (Join-Path $env:RUNNER_TEMP 'reuse-scripts\run-tests.ps1') -Programs "$env:RUNNER_TEMP\avp-tests" -Work "$env:RUNNER_TEMP\reuse" -Plan "$env:RUNNER_TEMP\reuse\plan.json"
          exit $LASTEXITCODE

      # The nightly run: every result it would have reused must have passed again tonight. It runs even when a test failed, and can only fail.
      - name: Check every result the night would have reused passed again
        if: always() && github.event_name == 'schedule'
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        run: |
          & (Join-Path $env:RUNNER_TEMP 'reuse-scripts\compare.ps1') -Work "$env:RUNNER_TEMP\reuse"
          exit $LASTEXITCODE

      # Which tests passed, as data for the job that works the records out. It's the one thing taken from after the tests: a test can only
      # say something false about its own pass or fail at this commit's inputs, which it always could.
      - name: Keep the tests' results
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/avpx_main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reuse-results
          path: ${{ runner.temp }}/reuse/results.json
          retention-days: 30
          if-no-files-found: error

      # Not a program like the others: it runs the release checks on made-up folders, and reads the release workflow.
      - name: Test the release checks
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        run: ./tests/release-test.ps1

      # Every test is built with the standard library's own bounds checks, and tests/build.ps1 refuses one whose settings leave them out,
      # turn them off again, or leave out the guard that won't compile a test without them (card STL-HARDEN-1, #140, added 2026-11-08 by
      # Melanikus for the AvP port). This makes it refuse, from a copy of a test's settings, and checks each reason. It's last in this job,
      # and builds into a folder of its own, because build.ps1 empties its folder before it builds.
      - name: Make build.ps1 refuse a test without the bounds checks, and check each reason
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        run: |
          $failed = [System.Collections.Generic.List[string]]::new()
          function Check([bool]$ok, [string]$what) { if ($ok) { "ok      $what" } else { "FAILED  $what"; $failed.Add($what) } }
          $pwsh = Join-Path $PSHOME 'pwsh.exe'
          $env:RUNNER_TEMP = Join-Path $env:RUNNER_TEMP 'refusal-probe'
          $good = [System.IO.File]::ReadAllText((Join-Path $PWD 'tests/glint_test.args'))

          # Writes settings to a made-up test, runs build.ps1 on it alone in a PowerShell of its own, takes the made-up test away again
          # whatever happens, and gives back the exit code and all build.ps1 said
          function Try-Settings([string]$settings) {
            $file = Join-Path $PWD 'tests/zz_refusal_probe_test.args'
            [System.IO.File]::WriteAllText($file, $settings)
            try { $said = & $pwsh -NoProfile -NonInteractive -File tests/build.ps1 -Only zz_refusal_probe_test 2>&1 | Out-String; $code = $LASTEXITCODE }
            finally { Remove-Item -LiteralPath $file -ErrorAction SilentlyContinue }
            @{ code = $code; text = $said }
          }

          Check ($good -cmatch ' /D_MSVC_STL_HARDENING=1' -and $good -cmatch ' /FIevery_test\.h') 'the settings copied from have the checks and the guard'

          $result = Try-Settings ($good -creplace ' /D_MSVC_STL_HARDENING=1', '')
          $result.text
          Check ($result.code -eq 1 -and $result.text -cmatch "zz_refusal_probe_test\.args doesn't ask for /D_MSVC_STL_HARDENING=1") 'without the checks, a test is refused, and told why'

          $result = Try-Settings ($good.TrimEnd() + ' /D_MSVC_STL_HARDENING=0')
          $result.text
          Check ($result.code -eq 1 -and $result.text -cmatch 'zz_refusal_probe_test\.args asks for /D_MSVC_STL_HARDENING=0, which could turn') 'with the checks turned off again later, it is refused, and told why'

          $result = Try-Settings ($good.TrimEnd() + ' /D_MSVC_STL_HARDENING_VECTOR=0')
          $result.text
          Check ($result.code -eq 1 -and $result.text -cmatch 'zz_refusal_probe_test\.args asks for /D_MSVC_STL_HARDENING_VECTOR=0, which could turn') 'with a part of them turned off, it is refused, and told why'

          $result = Try-Settings ($good -creplace ' /FIevery_test\.h', '')
          $result.text
          Check ($result.code -eq 1 -and $result.text -cmatch "zz_refusal_probe_test\.args doesn't ask for /Itests/every_test /FIevery_test\.h") 'without the guard, it is refused, and told why'

          Check (-not (Test-Path -LiteralPath (Join-Path $PWD 'tests/zz_refusal_probe_test.args'))) 'and the made-up test is gone again'

          # The guard itself (tests/every_test/every_test.h): without the checks, a test doesn't compile at all, whichever way it's built. A
          # take-out row can't show that, because the take-out runner needs every row's copy to build, so it's shown here, by the guard's own
          # words. Visual Studio is set up as build.ps1 sets it up, and cl only reads the code (/Zs), writing nothing.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $env:PATH = "$(Split-Path -Parent $vswhere);$env:PATH"
          Import-Module (Join-Path $visualStudio 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $visualStudio -SkipAutomaticLocation -DevCmdArguments '-arch=x86 -host_arch=amd64 -no_logo' | Out-Null
          $withoutChecks = @(((Get-Content tests/stl_bounds_canary_test.args) -join ' ') -split '\s+' | Where-Object { $_ -and $_ -cne '/D_MSVC_STL_HARDENING=1' })
          $said = & cl.exe /nologo /Zs @withoutChecks 2>&1 | Out-String
          $said
          Check ($LASTEXITCODE -ne 0 -and $said -cmatch "Every test is built with the standard library's bounds checks") 'and without the checks, the guard refuses to compile a test at all, and says why'

          # The step says how it went itself. A PowerShell step on GitHub otherwise ends with the exit code of the last program it ran, and
          # here that's a build.ps1 that was meant to refuse, so it would fail even with every check above passing.
          if ($failed.Count -gt 0) { throw "build.ps1 didn't refuse as it should: $($failed -join '; ')" }
          'build.ps1 refused each way, with each reason'
          exit 0

  # Every test again, built with the address sanitizer by tests/takeouts/sanitize.ps1 (card SANITIZE-RUN-1, added 2026-11-08 by Melanikus
  # for the AvP port). The sanitizer watches every read and write, and stops a test at the first one outside what it was given, so it finds
  # what a test doesn't look for. A crash or a memory bug is a security bug here (AvP Tao #1), so a test that doesn't pass under it stops the
  # merge, the same as one that fails above. It's slower than the ordinary run, so the tests are shared out between four machines: in name
  # order, the first test to part 1, the second to part 2, and so on, round again. A new test joins a part with no change to this file.
  # GitHub numbers the parts and counts them (strategy.job-index and strategy.job-total), so the list of parts below can be made longer or
  # shorter and no test is ever left out.
  sanitizer:
    name: Tests under the address sanitizer, part ${{ matrix.part }} of ${{ strategy.job-total }}
    # A test that hangs fails here, as above. A part took 3.6 to 6.5 minutes on 2026-11-11, so 20 is about three times the slowest: a
    # runner that's lost frees its place in minutes, not hours
    timeout-minutes: 20
    runs-on: windows-2025-vs2026   # pinned: the same machine as the Unit tests job
    strategy:
      fail-fast: false   # one part failing doesn't stop the others, so a run shows every test that needs work
      matrix:
        part: [1, 2, 3, 4]   # only the parts' names on the page: the tests are shared out by GitHub's own count, as above
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same libraries as the Unit tests job, for the tests that use them, but ENet and the two post-quantum libraries are built
      # with the sanitizer here, so their code is watched too: it's the code that reads what comes in from the network. sanitize.ps1 links the network tests against that copy, and
      # refuses any test that links an object or a library compiled without the sanitizer. Microsoft's D3DX comes as Microsoft makes it:
      # it's their program, with no source to build, and the shader test only loads it.
      - name: Fetch the game's shader compiler, and ENet and the post-quantum libraries built with the sanitizer
        uses: ./.github/actions/fetch-test-libraries
        with:
          ports: dxsdk-d3dx
          sanitized-ports: enet mldsa-native mlkem-native

      # Each test is built and run by sanitize.ps1 in a PowerShell of its own, so nothing one test's run leaves behind reaches the next.
      # Every test of the part is run, even after one fails, and then the step fails, naming each one that didn't pass. sanitize.ps1 gives
      # back 1 when the test failed or the sanitizer stopped it, and 2 when it couldn't be run at all, and its own lines say why.
      - name: Run this part's tests under the sanitizer
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        env:
          # Which part this is, counted from 0, and how many parts there are, both from GitHub, so they always agree with the list above
          PART: ${{ strategy.job-index }}
          PARTS: ${{ strategy.job-total }}
        run: |
          # In name order, compared letter by letter, so all four machines share them out the same way
          $names = [string[]]@(Get-ChildItem -LiteralPath tests -Filter '*.args' -File | ForEach-Object { $_.BaseName })
          [Array]::Sort($names, [StringComparer]::Ordinal)

          # With no tests at all this fails, so a wrong folder can't pass as "every test passed"
          if ($names.Count -eq 0) { throw 'No tests were found' }

          # An empty or wrong number would make every part take the same share, and leave the rest of the tests out without a word
          if ($env:PART -cnotmatch '\A[0-9]+\z' -or $env:PARTS -cnotmatch '\A[1-9][0-9]*\z' -or [int]$env:PART -ge [int]$env:PARTS) {
            throw "GitHub didn't say which part this is: part '$env:PART' (counted from 0) of '$env:PARTS'"
          }

          $part = [int]$env:PART
          $parts = [int]$env:PARTS
          $mine = @(for ($i = $part; $i -lt $names.Count; $i += $parts) { $names[$i] })
          "Part $($part + 1) of ${parts}: $($mine.Count) of the $($names.Count) tests: $($mine -join ', ')"

          $pwsh = Join-Path $PSHOME 'pwsh.exe'
          $notPassed = [System.Collections.Generic.List[string]]::new()

          foreach ($test in $mine) {
            "===== $test"
            & $pwsh -NoProfile -NonInteractive -File ./tests/takeouts/sanitize.ps1 $test
            if ($LASTEXITCODE -ne 0) { $notPassed.Add("$test (sanitize.ps1 gave back $LASTEXITCODE)") }
          }

          if ($notPassed.Count -gt 0) { throw "$($notPassed.Count) of this part's $($mine.Count) tests didn't pass under the sanitizer: $($notPassed -join ', '). Each one's own lines above say why" }
          "All $($mine.Count) of this part's tests pass under the address sanitizer"

  # sanitize.ps1's own refusals, made to happen on purpose, each checked for its reason. SANITIZE-RUN-1's probe ran it four times from one
  # window, and by the third the path was too long for Visual Studio's setup, which failed with nothing but a line from Windows. Now the
  # setup is done once in a window, and the script stops, saying why, when the setup can't be done or didn't finish. The old script fails
  # each of those three cases: it gave no reason of its own, and it set up again on every run. relief_map_file_test is used because it needs
  # nothing from vcpkg.
  #
  # Three more. The script refuses a name that isn't one of the repository's tests before it empties any folder (AvP Tao 3). It refuses
  # code compiled without the sanitizer: an object, a library made from one, a library named without a folder that isn't Windows' own,
  # and a test whose settings turn the sanitizer off for its own code. And the gate is seen to fail, because a check nobody has seen fail proves nothing:
  # broken tests are written here, one that reads past the end of a block and one that fails a check, and sanitize.ps1 must refuse each,
  # with its reason, and show what each said.
  sanitizer-refusals:
    name: The sanitizer script's own refusals
    timeout-minutes: 10   # it took under a minute on 2026-11-11; 10 is the least any job here is given
    runs-on: windows-2025-vs2026   # pinned: the same machine as the jobs above
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make sanitize.ps1 refuse, and check each reason
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        run: |
          $original = $env:PATH
          $pwsh = Join-Path $PSHOME 'pwsh.exe'
          $failed = [System.Collections.Generic.List[string]]::new()
          function Check([bool]$ok, [string]$what) { if ($ok) { "ok      $what" } else { "FAILED  $what"; $failed.Add($what) } }

          # Runs sanitize.ps1 on a test, in a PowerShell of its own, started with the path given, and gives back its exit code and all it
          # said. The step's own path is put back straight after, whatever happens.
          function Run-WithPath([string]$path, [string]$test = 'relief_map_file_test') {
            $said = Join-Path $env:RUNNER_TEMP 'refusal-said.txt'
            $errors = Join-Path $env:RUNNER_TEMP 'refusal-errors.txt'
            $env:PATH = $path
            try { $run = Start-Process -FilePath $pwsh -ArgumentList "-NoProfile -NonInteractive -File tests/takeouts/sanitize.ps1 $test" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $said -RedirectStandardError $errors }
            finally { $env:PATH = $original }
            @{ code = $run.ExitCode; text = "$(Get-Content -Raw -LiteralPath $said)$(Get-Content -Raw -LiteralPath $errors)" }
          }

          # 1. A path already too long for the setup to add to: this machine's own path, doubled and more until it's past 8,191 characters
          $long = $original
          while ($long.Length -le 8191) { $long = "$long;$original" }
          $result = Run-WithPath $long
          $result.text
          Check ($result.code -eq 2) "with a path of $($long.Length) characters, it can't run, and gives back 2 (it gave back $($result.code))"
          Check ($result.text -cmatch "Could not run the sanitizer: the path is \d+ characters, and Visual Studio's setup can't add to a path longer than 8191") 'and it says the path is too long for the setup, before trying it'

          # 2. A path short enough for the setup to start, and too long for it to finish: this machine's own path, made up to 8,000
          #    characters with folders that aren't there. The setup's own lines take it past 8,191 part way, as in the probe.
          $near = $original
          for ($n = 0; $near.Length -lt 8000; $n++) { $near = "$near;C:\not-a-folder-$n" }
          $result = Run-WithPath $near
          $result.text
          Check ($result.code -eq 2) "with a path of $($near.Length) characters, it can't run, and gives back 2 (it gave back $($result.code))"
          Check ($result.text -cmatch "Could not run the sanitizer: Visual Studio's setup didn't finish: .+ The path is now \d+ characters") 'and it says the setup didn''t finish, what it left out, and how long the path is'

          # 3. Three runs from one window, as the probe did: each passes, and the path after the third is the path after the first, so the
          #    setup was done once and nothing piles up. The old script added to the path on every run.
          $env:PATH = $original
          & ./tests/takeouts/sanitize.ps1 relief_map_file_test
          $first = $LASTEXITCODE
          $afterFirst = $env:PATH
          & ./tests/takeouts/sanitize.ps1 relief_map_file_test
          $second = $LASTEXITCODE
          & ./tests/takeouts/sanitize.ps1 relief_map_file_test
          $third = $LASTEXITCODE
          Check ($first -eq 0 -and $second -eq 0 -and $third -eq 0) "three runs from one window all pass (they gave back $first, $second and $third)"
          Check ($env:PATH -ceq $afterFirst) "and the path after the third is the one after the first, $($afterFirst.Length) characters, so the setup was done once"

          # The broken tests that 4 and 6 use are written into this job's own copy of the repository, and never committed. This one reads
          # one byte past the end of a block it asked for. Without the sanitizer that goes unnoticed: the program carries on and gives
          # back 0, so only the sanitizer can fail it.
          $settings = '/std:c++17 /EHsc /MD /W3 /sdl /FC'
          $readsPastTheEnd = @(
            '// Written by tests.yml''s sanitizer-refusals job, and never committed: it reads one byte past the end of a 16-byte block, on purpose'
            '#include <cstdio>'
            '#include <cstdlib>'
            'int main()'
            '{'
            '    volatile int past = 16;   // volatile, so the compiler can''t see that the read is past the end, and leave it out'
            '    char *block = static_cast<char *>(std::malloc(16));'
            '    if (!block) return 2;'
            '    std::printf("read %d\n", block[past]);'
            '    std::free(block);'
            '    return 0;'
            '}'
          )

          # 4. Code compiled without the sanitizer, coming in from outside the test's own build. It would run unwatched, and its read
          #    past the end would pass, because linking with the sanitizer brings in the sanitizer's library whatever was compiled with it
          #    (run 42493315111). sanitize.ps1 must refuse it, before it builds anything, in each way it can come in:
          #    - an object named in the test's settings;
          #    - a library named in them, made from that object;
          #    - a library named without a folder that isn't one of Windows' own, which this doesn't read;
          #    - and, after its build, the test's own code compiled with the sanitizer turned off by its settings.
          #    The object and the library are made here, by the compiler and lib.exe 3 set up in this window, while the window still has
          #    them: Run-WithPath puts the path back after its run.
          Set-Content -LiteralPath tests/canary_unwatched.cpp -Value $readsPastTheEnd
          $eachSetting = $settings.Split(' ')
          & cl.exe /nologo /c @eachSetting /Fo:tests/canary_unwatched.obj tests/canary_unwatched.cpp
          if ($LASTEXITCODE -ne 0) { throw "The broken object for check 4 didn't compile (cl gave back $LASTEXITCODE)" }
          & lib.exe /nologo /out:tests/canary_unwatched.lib tests/canary_unwatched.obj
          if ($LASTEXITCODE -ne 0) { throw "The broken library for check 4 wasn't made (lib.exe gave back $LASTEXITCODE)" }
          Set-Content -LiteralPath tests/canary_unwatched_test.args -Value '/MD', 'tests/canary_unwatched.obj'
          Set-Content -LiteralPath tests/canary_unwatched_lib_test.args -Value '/MD', 'tests/canary_unwatched.lib'
          Set-Content -LiteralPath tests/canary_unknown_lib_test.args -Value '/MD', 'tests/canary_unwatched.cpp', 'not_a_windows_library.lib'

          $result = Run-WithPath $original 'canary_unwatched_test'
          $result.text
          Check ($result.code -eq 1) "a test linking an object compiled without the sanitizer gives back 1 (it gave back $($result.code))"
          Check ($result.text -cmatch "canary_unwatched_test links tests/canary_unwatched\.obj, which wasn't compiled with the sanitizer, so its code would run unwatched") 'and it says which object, and why'
          $result = Run-WithPath $original 'canary_unwatched_lib_test'
          $result.text
          Check ($result.code -eq 1) "a test linking a library made from that object gives back 1 (it gave back $($result.code))"
          Check ($result.text -cmatch "canary_unwatched_lib_test links tests/canary_unwatched\.lib, whose \S*canary_unwatched\.obj wasn't compiled with the sanitizer, so its code would run unwatched") 'and it says which library, which object in it, and why'
          $result = Run-WithPath $original 'canary_unknown_lib_test'
          $result.text
          Check ($result.code -eq 1) "a test naming a library without a folder that isn't Windows' own gives back 1 (it gave back $($result.code))"
          Check ($result.text -cmatch "canary_unknown_lib_test's settings name not_a_windows_library\.lib, which isn't one of Windows' own libraries in the Windows SDK") 'and it says which library, and why'

          # And code compiled here with the sanitizer turned off: the compiler has /fno-sanitize=address, and a test's settings come after
          # the /fsanitize=address sanitize.ps1 gives. Every object the build makes must carry the sanitizer's mark, or the test is refused.
          Set-Content -LiteralPath tests/canary_sanitizer_off.cpp -Value $readsPastTheEnd
          Set-Content -LiteralPath tests/canary_sanitizer_off_test.args -Value ($settings + ' /fno-sanitize=address'), 'tests/canary_sanitizer_off.cpp'
          $result = Run-WithPath $original 'canary_sanitizer_off_test'
          $result.text
          Check ($result.code -eq 1) "a test whose settings turn the sanitizer off gives back 1 (it gave back $($result.code))"
          Check ($result.text -cmatch "canary_sanitizer_off_test's own canary_sanitizer_off\.obj wasn't compiled with the sanitizer, though this asked for it: something in its settings turned it off") 'and it says which object, and why'

          # 5. A name that isn't a test's is refused before any folder is touched. Here ".." points at this runner's own temporary folder,
          #    the one the sanitizer's folders are made in, and the old script emptied whatever its name pointed at. So a file is left
          #    there first, and it has to still be there afterwards.
          $marker = Join-Path $env:RUNNER_TEMP 'sanitize-name-marker.txt'
          Set-Content -LiteralPath $marker -Value 'Left here by the sanitizer-refusals job: sanitize.ps1 .. must not delete it'
          $result = Run-WithPath $original '..'
          $result.text
          Check ($result.code -eq 2) "with the name '..', it can't run, and gives back 2 (it gave back $($result.code))"
          Check ($result.text -cmatch "Could not run the sanitizer: '\.\.' isn't a test's name") 'and it says that isn''t a test''s name'
          Check (Test-Path -LiteralPath $marker -PathType Leaf) 'and the folder that name points at is as it was, with the file left in it'
          $result = Run-WithPath $original 'no_such_test'
          $result.text
          Check ($result.code -eq 2) "with the name of a test that isn't there, it can't run, and gives back 2 (it gave back $($result.code))"
          Check ($result.text -cmatch "Could not run the sanitizer: there's no test called no_such_test: tests\\no_such_test\.args isn't there") 'and it says there''s no such test'

          # 6. The gate has to be seen to fail. The read past the end, above, is built the way every test is, and a second broken test
          #    fails one of its own checks, as a test does. sanitize.ps1 must give back 1 for each, say why, and show what each said. If
          #    either passed, every green part above would mean nothing.
          Set-Content -LiteralPath tests/canary_overflow_test.args -Value $settings, 'tests/canary_overflow_test.cpp'
          Set-Content -LiteralPath tests/canary_overflow_test.cpp -Value $readsPastTheEnd
          Set-Content -LiteralPath tests/canary_fails_test.args -Value $settings, 'tests/canary_fails_test.cpp'
          Set-Content -LiteralPath tests/canary_fails_test.cpp -Value @(
            '// Written by tests.yml''s sanitizer-refusals job, and never committed: it fails one of its checks, and reads nothing it shouldn''t'
            '#include <cstdio>'
            'int main()'
            '{'
            '    std::printf("FAILED  a check this canary fails on purpose\n");'
            '    return 1;'
            '}'
          )

          $result = Run-WithPath $original 'canary_overflow_test'
          $result.text
          Check ($result.code -eq 1) "a test that reads past the end of a block gives back 1 (it gave back $($result.code))"
          Check ($result.text -cmatch 'The sanitizer stopped canary_overflow_test: .*AddressSanitizer: heap-buffer-overflow') 'and it says the sanitizer stopped it, for reading past the block'
          Check ($result.text -cmatch 'READ of size 1 at') 'and the log has the sanitizer''s whole report, not only its first line'
          $result = Run-WithPath $original 'canary_fails_test'
          $result.text
          Check ($result.code -eq 1) "a test that fails a check gives back 1 (it gave back $($result.code))"
          Check ($result.text -cmatch 'canary_fails_test failed under the sanitizer, with exit code 1') 'and it says the test failed, with its exit code'
          Check ($result.text -cmatch 'FAILED  a check this canary fails on purpose') 'and the log has what the test said'

          if ($failed.Count -gt 0) { throw "$($failed.Count) of the sanitizer script's own checks failed: $($failed -join '; ')" }
          "Each of the sanitizer script's refusals happens, with its reason, a window set up once stays as it was, and the gate fails a broken test"

  # One job with one name, to make a required check of. It passes only if every part passed, and the script's own refusals happened.
  sanitizer-result:
    name: Tests under the address sanitizer
    needs: [sanitizer, sanitizer-refusals]
    if: always()
    runs-on: ubuntu-24.04   # pinned, as above
    timeout-minutes: 5
    steps:
      - name: Say how it went
        env:
          PARTS: ${{ needs.sanitizer.result }}
          REFUSALS: ${{ needs.sanitizer-refusals.result }}
        run: |
          echo "The tests under the sanitizer: $PARTS. The sanitizer script's own refusals: $REFUSALS."
          if [ "$PARTS" != "success" ]; then echo "At least one test didn't pass under the sanitizer. The failed part's own job says which, and why."; exit 1; fi
          if [ "$REFUSALS" != "success" ]; then echo "One of sanitize.ps1's own refusals didn't happen as it should, or a broken test wasn't failed. That job says which."; exit 1; fi
          echo "Every test passes under the address sanitizer"

  # The records, worked out in a job of their own, on a machine no test has run on (PO, after Secondary's R1: anything run after the
  # tests on their own machine can be steered by them). A fresh checkout of the commit, the commit's own tests/reuse/record.ps1 run with
  # -NoProfile, and only data from the Unit tests job: the lists kept before any test ran, and the tests' pass or fail. It can write
  # nothing and record nothing. Only a run on avpx_main started by a push or the nightly schedule has records. Added 2026-11-11 by
  # Melanikus for the AvP port (the CI plan's step 4).
  reuse-write-records:
    name: Work the tests' records out
    needs: unit-tests
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/avpx_main'
    runs-on: ubuntu-24.04   # pinned, so a runner-image migration never changes this
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the lists kept before the tests ran
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reuse-lists
          path: ${{ runner.temp }}/lists

      - name: Get the tests' results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reuse-results
          path: ${{ runner.temp }}/results

      - name: Write the records
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        env:
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          ./tests/reuse/record.ps1 -Root $env:GITHUB_WORKSPACE -Lists "$env:RUNNER_TEMP/lists" -Results "$env:RUNNER_TEMP/results/results.json" -Work "$env:RUNNER_TEMP/records"
          exit $LASTEXITCODE

      - name: Keep the records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reuse-records
          path: ${{ runner.temp }}/records/records.json
          retention-days: 30
          if-no-files-found: error

  # The records, attested, so a later run can ask GitHub whether they came from this workflow on avpx_main, at that commit, on GitHub's own
  # runners (tests/reuse/lookup.ps1, gh attestation verify). This is the only job here that can record anything, and it runs none of our
  # code: no checkout, only the files, a check of their shape and against the lists kept before the tests ran, and the attestation, as
  # build.yml's attest job does. Added 2026-11-11 by Melanikus for the AvP port (the CI plan's step 4).
  record-results:
    name: Record the tests' results
    needs: reuse-write-records
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/avpx_main'
    runs-on: ubuntu-24.04   # pinned, so a runner-image migration never changes this
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write       # to prove to the attestation service which workflow this is
      attestations: write   # to record where the records came from
    steps:
      - name: Get the records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reuse-records
          path: reuse

      - name: Get the lists kept before the tests ran
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reuse-lists
          path: lists

      # Only a file in the shape record.ps1 writes, said to be from this very run and commit on avpx_main, whose every record names
      # exactly what the lists kept before any test ran say that test read and imports, is attested
      - name: Refuse records that aren't this run's, aren't in their shape, or don't match the lists
        env:
          RUN: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(ls -A reuse)" = "records.json" || { echo "The records folder holds more than records.json"; exit 1; }
          jq -e --arg run "$RUN" --arg sha "$SHA" '
            .schema == 3 and .run.id == $run and .run.sha == $sha and (.run.event == "push" or .run.event == "schedule") and
            .run.ref == "refs/heads/avpx_main" and (.records | type == "array") and
            all(.records[]; (.test | test("^[A-Za-z0-9_]+$")) and (.key | test("^[0-9a-f]{64}$")) and .kind == "unit" and .status == "ran" and
              (.class == "A" or .class == "B" or .class == "C") and (.importClass == "A" or .importClass == "B" or .importClass == "C") and
              (.result == "passed" or .result == "failed") and
              all(.parts[]; length == 2 and (.[0] | test("^[A-Za-z0-9_:./+-]+$")) and (.[1] | test("^[0-9a-f]{40,64}$"))) and
              all(.includes[]; test("^[A-Za-z0-9_./+-]+$")) and all(.imports[]; test("^[A-Za-z0-9_.-]+[.][dD][lL][lL]![A-Za-z0-9_?@$.#<>-]+$")))' reuse/records.json > /dev/null
          for test in $(jq -r '.records[].test' reuse/records.json); do
            for kind in includes imports; do
              test -f "lists/$test.$kind.txt" || { echo "No $kind list was kept for $test before the tests ran"; exit 1; }
              diff <(jq -r --arg t "$test" --arg k "$kind" '.records[] | select(.test == $t) | .[$k][]' reuse/records.json | sort) \
                   <(tr -d '\r' < "lists/$test.$kind.txt" | grep -v '^$' | sort) > /dev/null || { echo "$test's $kind in the records aren't the ones kept before the tests ran"; exit 1; }
            done
          done
          echo "The records are this run's, in their shape, and match the lists kept before the tests ran: $(jq '.records | length' reuse/records.json) of them"

      - name: Record where the records came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: reuse/records.json

  # A release's first job runs on this machine, not on the Windows one above, so pull requests try its checks here too. Otherwise their first real run here
  # would be the day of a release. tools/check-new-functions.ps1 reads the real code as well and says what it found, but only the test's own rows can fail
  # this: a function can land in one pull request and its caller in the next. The job's last step is a quick look at the code for the one form Snyk Code
  # can't read, which needs nothing more than this machine either.
  release-checks-on-ubuntu:
    name: Release checks on Ubuntu
    runs-on: ubuntu-24.04   # pinned: the same machine as the first job in release.yml
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the check compares with an older commit
          persist-credentials: false

      - name: Refuse any way a player's game could run Hudson
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        run: ./tools/check-hudson-asleep.ps1

      - name: Refuse any way a player's game could reach one of our servers
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        run: ./tools/check-servers-dev-only.ps1

      - name: Test the new-function check
        shell: pwsh -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'stop'; . '{0}'; if ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit $LASTEXITCODE }"
        run: ./tests/release-test.ps1 -OnlyNewFunctions

      # CODING-STANDARD.md, rule 1: const goes first for an enum type and for a type from inside a template. Write "const WEAPON_SLOT slot", not
      # "enum WEAPON_SLOT const slot", and "const auto found", not "std::map<...>::const_iterator const found". Snyk Code can't read a file with
      # either "no" form, and skips all of it. The count in snyk.yml then fails, but it can't say which file, so this names the file and the line.
      # Added 2026-11-07 by Melanikus for the AvP port; the second form added the same day.
      #
      # It reads every C and C++ file git has, of the kinds that count looks at, one line at a time. So a comment written that way is refused too
      # (say it another way), and a declaration split over two lines isn't seen here; the count in snyk.yml still catches that file.
      - name: Refuse the forms Snyk Code can't read (CODING-STANDARD.md, rule 1)
        shell: bash
        # Every C and C++ file here is plain ASCII today, but one in a pull request may not be. In a UTF-8 setting, a byte that isn't
        # UTF-8 makes grep call the whole file binary, and say only that it matched, with no line. So files are read byte by byte (LC_ALL=C),
        # and every one as text (grep -a).
        env:
          LC_ALL: C
        run: |
          # The same kinds of file as the count in snyk.yml
          types='\.(c|cc|cpp|cxx|c\+\+|h|hh|hpp|hxx|h\+\+|inl|ipp|tpp|inc)$'
          # The first form: "enum", then a type's name, then "const", each a whole word. The second: a type named from inside a template,
          # such as a map's iterator ("...>::iterator"), then "const" as a whole word. Either one is a line written this way.
          form='(^|[^A-Za-z0-9_])enum[[:space:]]+[A-Za-z_][A-Za-z0-9_:]*[[:space:]]+const([^A-Za-z0-9_]|$)|>[[:space:]]*(::[A-Za-z_][A-Za-z0-9_]*)+[[:space:]]+const([^A-Za-z0-9_]|$)'
          looked=0
          found=0

          # git gives the names with a zero byte after each, so a name with a space or a line end in it stays whole
          while IFS= read -r -d '' file; do
            looked=$((looked + 1))

            # grep gives back 0 when it found the form, 1 when it didn't, and more when it couldn't read the file
            said=0
            lines=$(grep -naE -- "$form" "$file") || said=$?
            if [ "$said" -gt 1 ]; then echo "::error::Couldn't read a C or C++ file to look in it"; exit 1; fi
            if [ "$said" -eq 1 ]; then continue; fi

            # A file's name can come from anyone's pull request. In a note, GitHub reads some characters in it as part of the note, so those
            # are written the way GitHub asks. A log line starts with our own words, because GitHub reads a line starting with :: as an order.
            note=${file//%/%25}; note=${note//$'\r'/%0D}; note=${note//$'\n'/%0A}; note=${note//:/%3A}; note=${note//,/%2C}
            while IFS= read -r hit; do
              found=$((found + 1))
              number=${hit%%:*}
              text=${hit#*:}
              echo "Found in ${file//[$'\r\n']/ }, line $number: ${text//$'\r'/}"
              echo "::error file=$note,line=$number,title=CODING-STANDARD.md rule 1::Put const first: const TYPE name, not enum TYPE const name, and const auto name, not a template's inner type then const. Snyk Code can't read a file with this form, and skips all of it."
            done <<< "$lines"
          done < <(git ls-files -z | grep -ziE "$types")

          # Nothing to look in would mean this looked at nothing, not that all is well
          if [ "$looked" -eq 0 ]; then echo "::error::No C or C++ files were found to look in"; exit 1; fi
          echo "Looked in $looked C and C++ files. Lines written this way: $found"
          if [ "$found" -gt 0 ]; then echo "CODING-STANDARD.md, rule 1, says why, and how to write it instead"; exit 1; fi
