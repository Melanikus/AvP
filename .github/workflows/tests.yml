# Runs the unit tests in tests/. A test that fails or doesn't build stops the merge, for everyone. This is a required check.
#
# Each test is a small program that returns 0 only if every check in it passed. tests/build.ps1 explains how to add one, and
# a new test runs here with no change to this file. How much of the code the tests cover is not a gate: only a failing test is.
name: Tests

on:
  push:
    branches: [avpx_main]
  pull_request:
    branches: [avpx_main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    # A test that hangs fails here. Without a limit, it would hold up a runner for 6 hours.
    timeout-minutes: 30
    runs-on: windows-2025-vs2026   # pinned: Windows Server 2025 with Visual Studio 2026, the compiler we build with
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hudson is the team's private test bot, and its code never ships. This comes first, because it takes seconds, and a hook left behind
      # should fail the pull request that brings it.
      - name: Refuse any of Hudson
        shell: pwsh
        run: ./tools/check-no-hudson.ps1

      # Neither of our code scanners can read shaders, so this is the gate they get. A warning fails it, as an error does.
      - name: Compile every shader
        shell: pwsh
        run: ./tests/compile-shaders.ps1

      # Some tests use the game's own libraries, and only those: this job doesn't build the game. The shader test compiles with the
      # library the game does, and the network tests link the game's ENet, so both come before the tests are built. The action says how
      # they're made, the same way as a real build, and the Take-outs check uses it too.
      - name: Fetch the game's shader compiler and ENet
        uses: ./.github/actions/fetch-test-libraries
        with:
          ports: dxsdk-d3dx enet

      - name: Build the tests
        shell: pwsh
        run: ./tests/build.ps1

      # With no tests at all this fails, so a broken build script can't pass as "every test passed".
      - name: Run every test
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem "$env:RUNNER_TEMP\avp-tests\*.exe")
          if ($tests.Count -eq 0) { throw 'No tests were built' }
          foreach ($test in $tests) {
            "Running $($test.Name)"
            & $test.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # Not a program like the others: it runs the release checks on made-up folders, and reads the release workflow.
      - name: Test the release checks
        shell: pwsh
        run: ./tests/release-test.ps1

  # A release's first job runs on this machine, not on the Windows one above, so pull requests try its checks here too. Otherwise their first real run here
  # would be the day of a release. tools/check-new-functions.ps1 reads the real code as well and says what it found, but only the test's own rows can fail
  # this: a function can land in one pull request and its caller in the next.
  release-checks-on-ubuntu:
    name: Release checks on Ubuntu
    runs-on: ubuntu-24.04   # pinned: the same machine as the first job in release.yml
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the check compares with an older commit
          persist-credentials: false

      - name: Refuse any of Hudson
        shell: pwsh
        run: ./tools/check-no-hudson.ps1

      - name: Test the new-function check
        shell: pwsh
        run: ./tests/release-test.ps1 -OnlyNewFunctions
