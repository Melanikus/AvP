# Second security gate for this repository (AvP Tao #1: security is paramount, the goal is zero vulnerabilities).
#
# Snyk (snyk.yml) can't parse a lot of modern C++. CodeQL reads C and C++ the way a compiler does, so it reaches code
# Snyk can't, and two different readers miss different things. It watches the real compiler while it builds ("tracing"),
# the most exact way to read code. A trace only sees what the build compiles, so the gate also demands that nothing is
# left out of the build: code nobody compiles is either dead and should go, or it's a mistake.
#
# CodeQL can also read code without building it ("build mode none"), by guessing the compiler's settings. We tried it,
# and it's not used here: it reported thousands of problems in code the traced jobs read cleanly, so it could only ever
# stay red, and after the unbuilt files were deleted it read nothing the traced jobs don't.
#
# The jobs:
#   - CodeQL (SAST) on our code watches the real build of the game in every configuration of the solution (Debug and
#     Release, x86), which also proves that the game builds on a clean machine.
#   - CodeQL (SAST) on the vcpkg libraries watches vcpkg build the libraries, with the same flags and patches the game
#     uses.
#   - CodeQL (SAST) on actions reads this repository's own workflows, because a security gate is worth attacking too.
#   - CodeQL (SAST) on library headers we use checks that nothing falls between the first two.
#
# The last job checks that a finding in a library header, seen while building the game, really was reported on the library's
# side too. Those findings are fixed in the library, so one the library jobs missed would otherwise fall between the two.
#
# ANY finding, or any code CodeQL could not read, fails the job (.github/scripts/codeql-gate.ps1 decides). A finding is
# resolved only by fixing it in the code: we don't ignore, park or exclude findings. D3DX is the one thing not read:
# it's Microsoft's binary package, with no source to scan.
name: CodeQL

on:
  push:
    branches: [avpx_main]
  pull_request:
    branches: [avpx_main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # By default CodeQL only reports on the lines a pull request changed, and may reuse an older scan for the rest. That's
  # fine as a reviewer's helper, but this is a gate: every run must read everything, so we turn both shortcuts off.
  CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
  CODEQL_OVERLAY_DATABASE_MODE: none

jobs:
  codeql-own:
    name: CodeQL (SAST) on our code
    runs-on: windows-2025-vs2026   # pinned: Windows Server 2025 with Visual Studio 2026, the compiler we build with
    permissions:
      contents: read
      security-events: write   # upload the report to code scanning
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The registry commit is the builtin-baseline in vcpkg.json, so the library versions never drift.
      # bootstrap-vcpkg validates the signature of the vcpkg tool it downloads.
      - name: Get vcpkg at the manifest's baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git init -q $root
          git -C $root fetch -q --depth 1 https://github.com/microsoft/vcpkg.git $baseline
          git -C $root checkout -q FETCH_HEAD
          if ((git -C $root rev-parse HEAD) -ne $baseline) { throw 'vcpkg is not at the manifest baseline' }
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Done before CodeQL starts watching: this job is about our code, and the job after it scans the libraries. The
      # game's project looks for them in this same folder, so its own vcpkg step then has nothing left to build.
      - name: Build the libraries the game needs
        shell: pwsh
        run: |
          & (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') install --triplet x86-windows `
            --x-install-root="$env:GITHUB_WORKSPACE\vcpkg_installed" --disable-metrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Get the pinned CodeQL tools
        id: tools
        uses: ./.github/actions/codeql-bundle

      - name: Start CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          tools: ${{ steps.tools.outputs.path }}
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality,./.github/codeql/read-problems,./.github/codeql/unreached-code
          trap-caching: false

      # The same command we build with by hand, once per configuration, because each one compiles code the others don't
      # (Debug has the game's debug-only code). The list comes from the solution, so a configuration added later gets
      # scanned without anyone remembering to change this file. If the game doesn't build, this job fails here.
      - name: Build the game while CodeQL watches
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found' }
          $configurations = @(Select-String -LiteralPath win32\VS2026\AvP.sln -Pattern '^\s*(\w+)\|(\w+)\s*=\s*\1\|\2\s*$')
          if ($configurations.Count -eq 0) { throw 'The solution lists no configurations' }
          foreach ($line in $configurations) {
            $configuration = $line.Matches[0].Groups[1].Value
            $platform = $line.Matches[0].Groups[2].Value
            "Building $configuration|$platform"
            & $msbuild win32\VS2026\AvP.sln /nologo /v:minimal /m "/p:Configuration=$configuration" "/p:Platform=$platform"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Analyse our code
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: codeql-own
          output: ${{ runner.temp }}/codeql-sarif
          upload: always
          upload-database: false

      - name: Fail on any finding, or any code CodeQL could not read
        if: ${{ !cancelled() }}
        shell: pwsh
        run: >-
          ./.github/scripts/codeql-gate.ps1 -Kind own -SarifFolder "$env:RUNNER_TEMP\codeql-sarif"
          -SourceRoot "$env:GITHUB_WORKSPACE" -ReportFolder "$env:RUNNER_TEMP\codeql-report"

      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-own-report
          path: |
            ${{ runner.temp }}/codeql-report
            ${{ runner.temp }}/codeql-sarif
            ${{ runner.temp }}/codeql_databases/*/log
            ${{ runner.temp }}/codeql_databases/*/diagnostic
          retention-days: 7

  codeql-libs:
    name: CodeQL (SAST) on the vcpkg libraries
    runs-on: windows-2025-vs2026   # pinned: Windows Server 2025 with Visual Studio 2026, the compiler we build with
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before CodeQL starts watching, so it doesn't sit through vcpkg's own setup.
      - name: Get vcpkg at the manifest's baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git init -q $root
          git -C $root fetch -q --depth 1 https://github.com/microsoft/vcpkg.git $baseline
          git -C $root checkout -q FETCH_HEAD
          if ((git -C $root rev-parse HEAD) -ne $baseline) { throw 'vcpkg is not at the manifest baseline' }
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Get the pinned CodeQL tools
        id: tools
        uses: ./.github/actions/codeql-bundle

      # CodeQL can only name files inside the folder it scans, so the build happens in a folder inside the checkout.
      - name: Make the folder the libraries are built in
        shell: pwsh
        run: New-Item -ItemType Directory libbuild | Out-Null

      - name: Start CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          tools: ${{ steps.tools.outputs.path }}
          languages: c-cpp
          build-mode: manual
          source-root: libbuild
          queries: security-and-quality,./.github/codeql/read-problems
          trap-caching: false

      # CodeQL watches the compiler through settings it leaves in environment variables, but on Windows vcpkg builds in
      # a clean environment that throws away anything it doesn't know. So we tell vcpkg to keep those settings, in the
      # two places it asks: VCPKG_KEEP_ENV_VARS, and a private copy of the x86-windows triplet (vcpkg's settings file
      # for this kind of build) with one line added. That line only lets the variables through: it adds no compiler
      # flag, and the "UNTRACKED" means vcpkg doesn't treat the build as a different one. The copy is created here in
      # this run's temporary folder and lives nowhere else, so the game's own build never reads it.
      # --binarysource=clear refuses ready-built libraries from any cache: CodeQL can only watch a real compile.
      - name: Build the pinned libraries while CodeQL watches
        shell: pwsh
        run: |
          $names = @(Get-ChildItem Env: | ForEach-Object Name |
            Where-Object { $_ -match '^(CODEQL|SEMMLE|ODASA|LGTM)_' -and $_ -notmatch '^CODEQL_ACTION_' })
          if ($names.Count -eq 0) { throw 'CodeQL left no settings to pass on' }
          $list = $names -join ';'
          "Variables kept for CodeQL: $list"

          $triplets = Join-Path $env:RUNNER_TEMP 'codeql-triplets'
          New-Item -ItemType Directory -Force $triplets | Out-Null
          $copy = Join-Path $triplets 'x86-windows.cmake'
          Copy-Item (Join-Path $env:VCPKG_ROOT 'triplets\x86-windows.cmake') $copy
          Add-Content $copy "set(VCPKG_ENV_PASSTHROUGH_UNTRACKED `"$list`")"
          Get-Content $copy

          $env:VCPKG_KEEP_ENV_VARS = $list
          & (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') install --triplet x86-windows --overlay-triplets="$triplets" `
            --binarysource=clear --x-install-root="$env:RUNNER_TEMP\installed" `
            --x-buildtrees-root="$env:GITHUB_WORKSPACE\libbuild" --disable-metrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Not uploaded to code scanning, same as Snyk's library job: these files aren't in our repository.
      - name: Analyse the libraries
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: codeql-libs
          output: ${{ runner.temp }}/codeql-sarif
          upload: never
          upload-database: false

      # LibraryFloors says how many real source files CodeQL must read in each library. Unlike our code, there is no list
      # of what vcpkg compiled that survives the build, so these numbers stand in for one: if CodeQL loses sight of part
      # of a library, its count drops and the job fails. Changing a number is a visible edit that someone must review,
      # like a pinned hash, so only change one when a library really changed. pthreads counts double because it compiles a
      # copy of itself for each configuration.
      - name: Fail on any finding, or any code CodeQL could not read
        if: ${{ !cancelled() }}
        shell: pwsh
        run: >-
          ./.github/scripts/codeql-gate.ps1 -Kind libs -SarifFolder "$env:RUNNER_TEMP\codeql-sarif"
          -SourceRoot "$env:GITHUB_WORKSPACE\libbuild" -ReportFolder "$env:RUNNER_TEMP\codeql-report"
          -LibraryFloors 'enet=9,fmt=3,libogg=2,libvorbis=22,openal-soft=104,pthreads=292'

      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-libs-report
          path: |
            ${{ runner.temp }}/codeql-report
            ${{ runner.temp }}/codeql-sarif
            ${{ runner.temp }}/codeql_databases/*/log
            ${{ runner.temp }}/codeql_databases/*/diagnostic
          retention-days: 7

  codeql-actions:
    name: CodeQL (SAST) on actions
    runs-on: windows-2025-vs2026   # pinned: the same machine as the other jobs, so the checked CodeQL download fits
    permissions:
      contents: read
      security-events: write   # upload the report to code scanning
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the pinned CodeQL tools
        id: tools
        uses: ./.github/actions/codeql-bundle

      - name: Start CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          tools: ${{ steps.tools.outputs.path }}
          languages: actions
          build-mode: none
          queries: security-and-quality
          trap-caching: false

      - name: Analyse
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: codeql-actions
          output: ${{ runner.temp }}/codeql-sarif
          upload: always
          upload-database: false

      - name: Fail on any finding, or any code CodeQL could not read
        if: ${{ !cancelled() }}
        shell: pwsh
        run: >-
          ./.github/scripts/codeql-gate.ps1 -Kind actions -SarifFolder "$env:RUNNER_TEMP\codeql-sarif"
          -SourceRoot "$env:GITHUB_WORKSPACE" -ReportFolder "$env:RUNNER_TEMP\codeql-report"

      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-actions-report
          path: |
            ${{ runner.temp }}/codeql-report
            ${{ runner.temp }}/codeql-sarif
            ${{ runner.temp }}/codeql_databases/*/log
            ${{ runner.temp }}/codeql_databases/*/diagnostic
          retention-days: 7

  codeql-library-headers:
    name: CodeQL (SAST) on library headers we use
    needs: [codeql-own, codeql-libs]
    # Always runs, for the same reason as the jobs above: a skipped required check counts as passed. If either report is
    # missing, the check below fails.
    if: ${{ always() }}
    runs-on: windows-2025-vs2026   # pinned: the same machine as the other jobs
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the report on our code
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codeql-own-report
          path: reports/own

      - name: Download the report on the libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codeql-libs-report
          path: reports/libs

      - name: Fail if a library header's finding reached no library job
        shell: pwsh
        run: >-
          ./.github/scripts/codeql-header-check.ps1 -OwnReport reports/own/codeql-report
          -LibraryReport reports/libs/codeql-report
