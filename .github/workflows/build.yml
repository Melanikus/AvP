# Builds the game for testing, only when the owner asks for it ("Run workflow", on avpx_main).
#
# It never runs by itself. Anyone can download what a public repository builds, and nothing is released until it's safe
# (AvP Tao #1): no published build while any known vulnerability is open, and some still are. So there is no automatic
# build of each commit and no build from a tag for now. Turning those on is a decision for when the known problems are
# closed. Before that, a tag must be checked by something a commit can't remove, because this file comes from the commit
# being built.
#
# The build is kept as a workflow artifact with its SHA-256 hashes. It is NOT a GitHub release: release.yml makes those. To install
# one of these, see PLAYTEST.md.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read   # to read the scan results of the commit being built

jobs:
  build:
    name: Make a test build
    runs-on: windows-2025-vs2026   # pinned: Windows Server 2025 with Visual Studio 2026, the compiler we build with
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only scanned code on avpx_main gets built. If this step fails there is no build. A skipped or missing scan counts
      # as a failure.
      - name: Refuse anything that is not scanned code on avpx_main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/avpx_main') { throw 'Builds come only from avpx_main' }
          $results = gh api --paginate "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/check-runs?per_page=100" --jq '.check_runs[] | .name + "=" + .conclusion'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the scan results' }
          $required = 'Snyk Code (SAST)', 'Snyk Open Source (SCA)', 'Snyk on the vcpkg libraries', 'Unit tests', 'Build the game', 'Release checks on Ubuntu'
          foreach ($check in $required) {
            if ($results -notcontains "$check=success") { throw "'$check' did not pass on this commit" }
          }
          "$env:GITHUB_SHA is scanned code on avpx_main."

      # The same script every pull request runs (game-build.yml), so this can't be the first time these steps have run.
      - name: Build the game and make its package
        shell: pwsh
        run: ./tools/build-and-package.ps1 -OutFolder "$env:RUNNER_TEMP\package"

      # The symbols and map of the game and its two film libraries, to name the place of a crash in this build. They're never in the
      # package. This is open source, so they hold nothing secret, and the folders they name are this machine's.
      - name: Keep the symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symbols
          path: |
            win32/VS2026/Win32/Release/*.pdb
            win32/VS2026/Win32/Release/*.map
          if-no-files-found: error

      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avp-${{ github.ref_name }}
          path: ${{ runner.temp }}/package
          retention-days: 30
          if-no-files-found: error
