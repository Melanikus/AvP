# Makes a release of the game, only when the owner asks for it ("Run workflow", on avpx_main, with a version number, or a beta's version
# for a pre-release: see RELEASING.md).
#
# It stops before building anything unless this exact commit may be released: the first job's steps are the list of what it
# checks, and RELEASE-BLOCKERS.md says what's still in the way. Nothing is released while we know about an open hole (AvP Tao #1),
# and this is a machine holding us to that.
#
# It never publishes anything. It ends with a draft release that only people with write access can see, and the owner reads that and
# presses Publish. Until then there's no tag either: GitHub makes the tag when the draft is published.
#
# Why it's started by hand, and not by pushing a tag: a workflow comes from the commit it runs on, so a tag could point at a commit
# with these checks taken out. Started from avpx_main, this file comes from the protected branch, where changing it has to get past
# the same checks as anything else.
#
# RELEASING.md says how to use this, and what has to be set up on GitHub for it to work. The first real run is what proves the last
# job: nothing can try it short of a real run. tests/release-test.ps1 proves that each check is there and comes before it.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version: three numbers such as 1.0.0, or a beta of one such as 1.0.0-beta.0, which makes a pre-release. A beta's number is the next one: see RELEASING.md"
        required: true
        type: string

# Nothing by default: each job says what it needs, and only the last one can write anything.
permissions: {}

# One at a time, so that two runs can't be checking the same version at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check this commit may be released
    runs-on: ubuntu-24.04   # pinned, so a runner-image migration never changes the gate
    timeout-minutes: 10
    permissions:
      contents: read          # to read the code, and which tags there are
      checks: read            # to read the scan results of this commit
      security-events: read   # to read whether any code scanning alert is open
    # The tag and whether it's a pre-release, worked out by tools/check-release.ps1 once everything has passed, for the last job, which has
    # no copy of the code to work them out from
    outputs:
      tag: ${{ steps.refuse.outputs.tag }}
      prerelease: ${{ steps.refuse.outputs.prerelease }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # tools/check-new-functions.ps1 compares with an older commit, so this job needs the history

      # The version comes in through a setting and not written into the command, because it's typed by a person, and written into
      # the command it would be run as part of it.
      - name: Refuse anything that may not be released
        id: refuse
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: ./tools/check-release.ps1 -Version $env:VERSION

      # Hudson is the team's test bot, in the game since 2026-11-09, and a player's game must never run any of it. Every pull request has
      # already run this: this is the last look.
      - name: Refuse any way a player's game could run Hudson
        shell: pwsh
        run: ./tools/check-hudson-asleep.ps1

      # The owner's rulings, 2026-11-09 and 2026-11-10 (#175): a release plays online only the safe way, with the servers its servers.cfg
      # names (tools/check-online-play.ps1, which also prints them for the release's text). Every pull request has already run this: this
      # is the last look. This release ships no servers.cfg, so it plays no online games at all (the owner's ruling R-GOAL-8, 2026-11-11:
      # "Online off in beta.2"; tools/check-release-package.ps1 refuses a package with one), and the code is held to the rules all the same.
      - name: Refuse any way a player's game could play online but the safe way
        shell: pwsh
        run: ./tools/check-online-play.ps1

      # A function added to the game that the game never uses is dead code left behind. It reads the code, so it needs nothing from GitHub.
      - name: Refuse a new function the game does not use
        shell: pwsh
        run: ./tools/check-new-functions.ps1

  build:
    name: Build the package
    needs: check
    runs-on: windows-2025-vs2026   # pinned: Windows Server 2025 with Visual Studio 2026, the compiler we build with
    timeout-minutes: 120           # the libraries are built from source, so this takes a while
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same script every pull request runs (game-build.yml), so this can't be the first time these steps have run.
      - name: Build the game and make its package
        shell: pwsh
        env:
          # So the game's log says which release it is (tools/build-and-package.ps1 writes it into 3dc/build_version.h)
          VERSION: ${{ inputs.version }}
        run: ./tools/build-and-package.ps1 -OutFolder "$env:RUNNER_TEMP\package"

      - name: Refuse a package with anything missing
        shell: pwsh
        run: ./tools/check-release-package.ps1 -Package "$env:RUNNER_TEMP\package" -Commit $env:GITHUB_SHA

      # Once the package is checked: the symbols and map of the game and its two film libraries, to name the place of a crash in
      # this build. They're never in the package. This is open source, so they hold nothing secret, and the folders they name are
      # this machine's.
      - name: Keep the symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-symbols
          path: |
            win32/VS2026/Win32/Release/*.pdb
            win32/VS2026/Win32/Release/*.map
          retention-days: 90
          if-no-files-found: error

      - name: Zip the package, and work out its hash
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $folder = "$env:RUNNER_TEMP\release"
          New-Item -ItemType Directory -Force $folder | Out-Null
          $name = "AvP-$env:VERSION-windows-x86.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP\package\*" -DestinationPath (Join-Path $folder $name)
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $folder $name)).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii (Join-Path $folder 'SHA256SUMS')
          Get-Content (Join-Path $folder 'SHA256SUMS')

      # For the scan on VirusTotal, and for the last job, which has no build tools and no copy of the code. Anyone can download what a
      # public repository builds, so this is kept for the shortest time there is. The checks above have already said nothing is in the way
      # of a release.
      - name: Keep the package for the next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release
          retention-days: 1
          if-no-files-found: error

  # VirusTotal runs about 70 virus scanners on a file. The zip is looked up there by its hash, sent if VirusTotal hasn't seen it, and the
  # analysis waited for. What comes back is from outside our code, so tools/check-virustotal.ps1 reads every answer before anything here
  # believes it (AvP Tao #3). Nothing VirusTotal wrote is printed but an analysis's number, which may only be letters, digits, + / and =,
  # so it can't start an order to GitHub (a line starting ::) or break a line, and it's escaped before it goes into an address.
  #
  # The user's ruling, 2026-11-08: if any scanner flags it, the draft is still made, its text starts by saying so, and the run ends red, so
  # nobody publishes it before reading the report. An answer that can't be trusted stops the run here, with no draft.
  #
  # Why a job of its own: the key is kept in the release environment, and only a job under it can read it, so this waits for the owner too.
  # The last job can write to the repository, and an answer from outside is never read there: this job can write nothing.
  scan:
    name: Scan the package on VirusTotal
    needs: build
    runs-on: ubuntu-24.04   # pinned, so a runner-image migration never changes the gate
    timeout-minutes: 30     # the free key takes 4 questions a minute, and an analysis takes a few minutes
    environment: release    # where the VirusTotal key is kept. See RELEASING.md
    permissions:
      contents: read        # to read the code, for tools/check-virustotal.ps1. Nothing else
    # What it found, for the last job, which checks them again: our own hash, and numbers that have been checked. No text VirusTotal wrote.
    outputs:
      sha256: ${{ steps.ask.outputs.sha256 }}
      malicious: ${{ steps.ask.outputs.malicious }}
      suspicious: ${{ steps.ask.outputs.suspicious }}
      answered: ${{ steps.ask.outputs.answered }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release

      # The key reaches only this step, through its environment. It's taken out of that environment before anything starts, so the
      # programs this step starts aren't given it. That isn't everything: on Linux, any program running as the same user can still read
      # this step's own starting environment (/proc/<its number>/environ), and the key is in it. So this step starts one program only,
      # tools/check-virustotal.ps1 from this commit, and nothing else may be started here: tests/release-test.ps1 checks that it isn't.
      # The key is only ever sent in the x-apikey header to www.virustotal.com, never written on a command line, and GitHub hides it if it
      # ever shows in the log. A redirect isn't followed, so the header can't be sent anywhere else.
      - name: Ask VirusTotal about the package
        id: ask
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          $key = $env:VIRUSTOTAL_API_KEY
          if (-not $key) { throw 'The VIRUSTOTAL_API_KEY secret is missing from the release environment' }
          Remove-Item Env:VIRUSTOTAL_API_KEY
          $headers = @{ 'x-apikey' = $key }

          # SHA256SUMS came from the build job, which runs other people's code: the libraries' own build scripts. So it's read as hostile
          # too. It has one line, a SHA-256 and the name of the zip this version makes, and nothing else, so the file sent is that zip.
          # The version is one of the two forms tools/check-release.ps1 lets through, written here letter for letter as there.
          $isBeta = $env:VERSION -cmatch '^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})-beta\.(0|[1-9][0-9]{0,3})\z'
          if (-not $isBeta -and $env:VERSION -cnotmatch '^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\z') { throw 'The version is not one this workflow makes' }
          $sums = @(Get-Content release/SHA256SUMS)
          if ($sums.Count -ne 1) { throw 'SHA256SUMS should have one line, for the zip' }
          $sha, $name = $sums[0] -split '  ', 2
          if ($sha -cnotmatch '^[0-9a-f]{64}\z') { throw 'The hash in SHA256SUMS is not a SHA-256' }
          if ($name -cne "AvP-$env:VERSION-windows-x86.zip") { throw 'SHA256SUMS names a file that is not the zip this version makes' }
          $zip = "release/$name"
          $answers = Join-Path $env:RUNNER_TEMP 'virustotal'
          New-Item -ItemType Directory -Force $answers | Out-Null

          # Every question to VirusTotal, waits included, has to be done by this time, inside the job's 30 minutes
          $giveUp = (Get-Date).AddMinutes(25)

          # tools/check-virustotal.ps1 checks the zip, or one saved answer, prints what it found, and gives back the line starting
          # ANSWER:. Anything wrong stops this step with its reason, and so the run, with no draft.
          function Ask-Checker([string[]]$arguments)
          {
            $said = @(& pwsh -NoProfile -File ./tools/check-virustotal.ps1 -Sha256 $sha @arguments)
            $code = $LASTEXITCODE
            $said | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { exit 1 }
            $answer = @($said | Where-Object { $_.StartsWith('ANSWER: ') })
            if ($answer.Count -ne 1) { throw 'tools/check-virustotal.ps1 gave no answer' }
            return $answer[0].Substring('ANSWER: '.Length)
          }

          # One question to VirusTotal, its answer saved as it came, for the checker. At most one every 20 seconds, so this stays inside
          # the free key's 4 a minute. If VirusTotal says the key has asked too often (429, which a key already busy elsewhere can get),
          # it waits a minute and asks again, until the time is up. Gives back the answer's HTTP status.
          $script:lastAsked = [datetime]::MinValue
          function Ask-VirusTotal([string]$method, [string]$path, [string]$saveAs, $form)
          {
            while ($true)
            {
              if ((Get-Date) -gt $giveUp) { throw 'VirusTotal had not answered in time' }
              $wait = 20 - ((Get-Date) - $script:lastAsked).TotalSeconds
              if ($wait -gt 0) { Start-Sleep -Seconds ([math]::Ceiling($wait)) }
              $script:lastAsked = Get-Date
              $asking = @{ Uri = "https://www.virustotal.com/api/v3/$path"; Method = $method; Headers = $headers; OutFile = $saveAs; TimeoutSec = 300; MaximumRedirection = 0; SkipHttpErrorCheck = $true; StatusCodeVariable = 'answeredWith' }
              if ($form) { $asking.Form = $form }
              Invoke-RestMethod @asking
              if ($answeredWith -ne 429) { return $answeredWith }
              Write-Host 'VirusTotal says the key has asked too often. Waiting a minute.'
              Start-Sleep -Seconds 60
            }
          }

          # The zip is the one the build made, and small enough to send
          if ((Ask-Checker @('-Package', $zip)) -cne 'ready') { throw 'The zip is not ready to send' }

          # Does VirusTotal already know it, with a finished analysis?
          $status = Ask-VirusTotal 'Get' "files/$sha" "$answers/lookup.json"
          if ($status -eq 200) { $answer = Ask-Checker @('-Answer', "$answers/lookup.json", '-Kind', 'lookup') }
          elseif ($status -eq 404) { 'VirusTotal has never seen this zip.'; $answer = 'not-analysed' }
          else { throw "VirusTotal answered the question about the zip with HTTP $status" }

          # If not: send it, and wait for the analysis to finish. It's asked about every 30 seconds or so, until the time is up.
          if ($answer -ceq 'not-analysed')
          {
            $status = Ask-VirusTotal 'Post' 'files' "$answers/upload.json" @{ file = Get-Item -LiteralPath $zip }
            if ($status -ne 200) { throw "VirusTotal answered the upload with HTTP $status" }
            $answer = Ask-Checker @('-Answer', "$answers/upload.json", '-Kind', 'upload')
            if ($answer -cnotmatch '^analysis [A-Za-z0-9+/=]{1,200}\z') { throw 'The upload gave no analysis' }
            $id = $answer.Substring('analysis '.Length)

            $answer = 'waiting'
            while ($answer -ceq 'waiting')
            {
              Start-Sleep -Seconds 10
              $status = Ask-VirusTotal 'Get' "analyses/$([uri]::EscapeDataString($id))" "$answers/analysis.json"
              if ($status -ne 200) { throw "VirusTotal answered the question about the analysis with HTTP $status" }
              $answer = Ask-Checker @('-Answer', "$answers/analysis.json", '-Kind', 'analysis', '-AnalysisId', $id)
            }
          }

          # What it found, for the last job: how many scanners called it malicious, how many suspicious, and how many gave an answer
          if ($answer -cmatch '^counted (0|[1-9][0-9]{0,3}) (0|[1-9][0-9]{0,3}) ([1-9][0-9]{0,3})\z')
          {
            $noMark = New-Object System.Text.UTF8Encoding $false
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "sha256=$sha`nmalicious=$($Matches[1])`nsuspicious=$($Matches[2])`nanswered=$($Matches[3])`n", $noMark)
          }
          else
          {
            throw 'tools/check-virustotal.ps1 gave no count'
          }

  publish:
    name: Make the draft release
    needs: [check, build, scan]   # build for the package; check for the tag and whether it's a pre-release; scan for what VirusTotal found
    runs-on: ubuntu-24.04   # pinned, so a runner-image migration never changes the gate
    timeout-minutes: 15
    environment: release    # waits here until the owner approves. See RELEASING.md for how this is set up on GitHub
    permissions:
      contents: write       # to make the draft. This is the only job in any workflow here that can write to the repository
      id-token: write       # to prove to the attestation service which workflow this is
      attestations: write   # to record how the package was built
    # This job runs no code from the repository, and doesn't even have a copy of it, so nothing that came through the build can
    # get at what this job is allowed to do.
    steps:
      - name: Get the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release

      # The owner may approve this long after the checks ran.
      - name: Refuse if anything has changed since the checks
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          SCAN_SHA256: ${{ needs.scan.outputs.sha256 }}
          SCAN_MALICIOUS: ${{ needs.scan.outputs.malicious }}
          SCAN_SUSPICIOUS: ${{ needs.scan.outputs.suspicious }}
          SCAN_ANSWERED: ${{ needs.scan.outputs.answered }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tip = gh api "repos/$env:GITHUB_REPOSITORY/commits/avpx_main" --jq .sha
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the tip of avpx_main' }
          if ($tip -cne $env:GITHUB_SHA) { throw "avpx_main has moved on to $tip since this was checked, so this commit is no longer its tip" }

          # The tag came from the first job. It's looked at again here, before anything uses it: the version has to be one of the two forms
          # tools/check-release.ps1 lets through, written here letter for letter as there, the tag has to be v and the version, and only a
          # beta is a pre-release.
          $isBeta = $env:VERSION -cmatch '^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})-beta\.(0|[1-9][0-9]{0,3})\z'
          if (-not $isBeta -and $env:VERSION -cnotmatch '^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\z') { throw 'The version is not one this workflow makes' }
          if ($env:TAG -cne "v$env:VERSION") { throw 'The tag from the checks is not the one this version makes' }
          if ($env:PRERELEASE -cne $(if ($isBeta) { 'true' } else { 'false' })) { throw 'Whether this is a pre-release does not match the version' }

          # Only this job can see drafts, so this is the place to find one that's already using this tag.
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the list of releases' }
          if ($releases -ccontains $env:TAG) { throw "There is already a release of $env:TAG, maybe a draft" }

          # SHA256SUMS came from the build job, which runs other people's code, so it's read as hostile: one line, a SHA-256 and the name
          # of the zip this version makes, and nothing else. Then the zip has to be what it says.
          $sums = @(Get-Content release/SHA256SUMS)
          if ($sums.Count -ne 1) { throw 'SHA256SUMS should have one line, for the zip' }
          $wanted, $name = $sums[0] -split '  ', 2
          if ($wanted -cnotmatch '^[0-9a-f]{64}\z') { throw 'The hash in SHA256SUMS is not a SHA-256' }
          if ($name -cne "AvP-$env:VERSION-windows-x86.zip") { throw 'SHA256SUMS names a file that is not the zip this version makes' }
          if ((Get-FileHash -Algorithm SHA256 "release/$name").Hash.ToLower() -cne $wanted) { throw 'The package is not what the build made' }

          # What VirusTotal found came from the scan job, which checked its answers. It's looked at again here, before the draft uses it:
          # whole numbers, at least the 20 scanners tools/check-virustotal.ps1 asks for, and about this very zip.
          if ($env:SCAN_SHA256 -cne $wanted) { throw 'The scan on VirusTotal was of a different zip' }
          if ($env:SCAN_MALICIOUS -cnotmatch '^(0|[1-9][0-9]{0,3})\z' -or $env:SCAN_SUSPICIOUS -cnotmatch '^(0|[1-9][0-9]{0,3})\z') { throw 'A count from the scan is not a whole number' }
          if ($env:SCAN_ANSWERED -cnotmatch '^[1-9][0-9]{0,3}\z' -or [int]$env:SCAN_ANSWERED -lt 20) { throw 'The scan did not count enough scanners' }

      - name: Record how the package was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      # --target says which commit the tag goes on when the owner publishes. A beta is made a pre-release, and it's still a draft that only
      # the owner can publish.
      #
      # What VirusTotal found goes in the draft's text, with the link to its report. If any scanner flagged the zip, the text starts by
      # saying so, and this step ends red once the draft is made (the user's ruling, 2026-11-08), so the run shows it too.
      - name: Make the draft
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          SCAN_MALICIOUS: ${{ needs.scan.outputs.malicious }}
          SCAN_SUSPICIOUS: ${{ needs.scan.outputs.suspicious }}
          SCAN_ANSWERED: ${{ needs.scan.outputs.answered }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $preRelease = $env:PRERELEASE -ceq 'true'

          # Read again as the step above read it, since this step uses the name too
          $sums = @(Get-Content release/SHA256SUMS)
          if ($sums.Count -ne 1) { throw 'SHA256SUMS should have one line, for the zip' }
          $hash, $name = $sums[0] -split '  ', 2
          if ($hash -cnotmatch '^[0-9a-f]{64}\z') { throw 'The hash in SHA256SUMS is not a SHA-256' }
          if ($name -cne "AvP-$env:VERSION-windows-x86.zip") { throw 'SHA256SUMS names a file that is not the zip this version makes' }

          $report = "https://www.virustotal.com/gui/file/$hash"
          $flagged = [int]$env:SCAN_MALICIOUS + [int]$env:SCAN_SUSPICIOUS
          $warning = "VirusTotal: $flagged of $env:SCAN_ANSWERED engines flagged this zip, so don't publish before reading $report"
          $scanned = if ($flagged -gt 0) { "VirusTotal: $env:SCAN_MALICIOUS malicious, $env:SCAN_SUSPICIOUS suspicious, of $env:SCAN_ANSWERED engines: $report" } else { "VirusTotal: none of $env:SCAN_ANSWERED engines flagged this zip: $report" }
          $first = if ($flagged -gt 0) { @("**$warning**", '') } else { @() }

          @($first + @(
            "Built from commit $env:GITHUB_SHA by run $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID.",
            '',
            "SHA-256 of ${name}: $hash",
            '',
            $scanned,
            '',
            "To check that this file is what that run built: gh attestation verify $name --repo $env:GITHUB_REPOSITORY",
            '',
            'The owner writes what changed here before publishing. RELEASING.md says what to read first.'
          )) | Out-File -Encoding utf8 notes.md

          $alsoSay = @()
          if ($preRelease) { $alsoSay += '--prerelease' }
          gh release create $tag "release/$name" release/SHA256SUMS --repo $env:GITHUB_REPOSITORY --draft --target $env:GITHUB_SHA --title "AvP $tag" --notes-file notes.md @alsoSay
          if ($LASTEXITCODE -ne 0) { throw 'The draft could not be made' }

          $made = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,targetCommitish | ConvertFrom-Json
          if (-not $made.isDraft) { throw 'The release is not a draft' }
          if ($made.isPrerelease -ne $preRelease) { throw "The draft's pre-release mark is $($made.isPrerelease), and it should be $preRelease" }
          if ($made.targetCommitish -cne $env:GITHUB_SHA) { throw "The draft points at $($made.targetCommitish), not at the commit that was checked" }

          if ($flagged -gt 0) { throw "The draft of $tag is made, but $warning" }
          "The draft of $tag is ready for the owner to read and publish."
