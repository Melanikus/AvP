# The settings every Hudson run starts from. run-hudson.ps1 copies this into the run's folder before each run, so that two runs start the same, and a change to one of the game's defaults can't quietly change a run.
# These are the game's own defaults, apart from the window size and not waiting for the screen. The game rewrites its copy when it ends, so this one is never touched.
# If the game starts asking for a setting that isn't here, it uses its default, and says so as an error in the log. Then add it here.
[Audio]
SampleRate = 44100

[Gameplay]
TurnSpeedAdjust = true

[Misc]
UnlimitedSaves = false

[Networking]
IncomingBandwidth = 0
OutgoingBandwidth = 0
PortNumber = 23513

[Video]
AutoGenerateMaps = false
DevViewsKey = 20
Rendering = GOURAUD
RenderingKey = 22
Shadows = false
ShadowsKey = 18

[VideoMode]
Height = 720
UseTripleBuffering = false
UseVSync = false
Width = 1280
